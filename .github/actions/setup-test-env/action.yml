name: 'Setup Test Environment'
description: 'Sets up the environment for testing (install dependencies, restore cache, clean ports)'

runs:
  using: "composite"
  steps:
    # Java 21, xvfb, lsof, netcat, etc. are already installed by
    # .github/container/Dockerfile when it builds the E2E image, so there is
    # nothing to install here. Re-running `apt-get install` on every matrix
    # shard only pays an `apt-get update` network round trip for no effect.

    - name: Restore dependencies from cache
      shell: bash
      run: |
        echo "::group::Restore dependencies from cache"
        start=$(date +%s)
        # Symlink the pre-installed node_modules from the image cache instead
        # of copying them: the checkout directory is a bind-mounted volume
        # distinct from the image layer that /cache lives in, but a symlink
        # resolves through the mount just fine and avoids recursively copying
        # potentially gigabyte-sized dependency trees on every shard.
        for dir in client server functions scripts; do
          if [ -d "/cache/${dir}/node_modules" ] && [ ! -e "${dir}/node_modules" ]; then
            ln -s "/cache/${dir}/node_modules" "${dir}/node_modules"
            chmod +x "${dir}/node_modules/.bin/"* 2>/dev/null || true
          fi
        done
        echo "Restore dependencies from cache took $(( $(date +%s) - start ))s"
        echo "::endgroup::"

    - name: Setup test environment
      shell: bash
      run: |
        echo "::group::Clean up existing processes"
        start=$(date +%s)
        # The container is freshly created for this shard, so there is
        # nothing left running from a previous job -- no fixed sleep needed,
        # only the (cheap, already-fast) best-effort cleanup in case the base
        # image ever starts shipping a leftover process.
        if [ -f "scripts/kill-tinylicious.js" ]; then
          node scripts/kill-tinylicious.js || echo "Process cleanup script failed, continuing..."
        fi
        pkill -f "port 7090" || true
        pkill -f "tinylicious" || true
        pkill -f "firebase" || true
        pkill -f "vite" || true
        echo "Clean up existing processes took $(( $(date +%s) - start ))s"
        echo "::endgroup::"

    - name: Run setup script
      shell: bash
      env:
        CI: true
        NODE_ENV: test
        TEST_ENV: localhost
        DISPLAY: :99
        DISABLE_POSTHOG: true
        VITE_DISABLE_FLUID_TELEMETRY: true
        PREINSTALLED_ENV: true
        SKIP_SERVER_START: "0"
        SKIP_PORT_WAIT: "0"
      run: |
        echo "::group::Run setup script"
        start=$(date +%s)
        # Create sentinel file to skip dependency installation in setup.sh
        touch .setup-installed

        # Retry setup.sh up to 3 times
        MAX_RETRIES=3
        RETRY_DELAY=10
        count=0
        success=false

        while [ $count -lt $MAX_RETRIES ]; do
          if bash scripts/setup.sh; then
            success=true
            break
          else
            count=$((count + 1))
            if [ $count -lt $MAX_RETRIES ]; then
              echo "Setup failed. Retrying in $RETRY_DELAY seconds... (Attempt $count/$MAX_RETRIES)"
              sleep $RETRY_DELAY
            else
              echo "Setup failed after $MAX_RETRIES attempts."
            fi
          fi
        done
        echo "Run setup script took $(( $(date +%s) - start ))s"
        echo "::endgroup::"

        if [ "$success" = "false" ]; then
          exit 1
        fi
