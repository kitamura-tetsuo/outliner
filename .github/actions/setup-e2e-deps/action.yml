name: 'Setup E2E dependencies (direct runner)'
description: >-
  Restores everything the E2E runtime needs on a plain ubuntu-latest runner
  (no job-level container): Node.js, JDK 21, npm dependency trees, the
  firebase-tools CLI, OS packages, and the Playwright browser. Uses
  GitHub Actions caching keyed on the lockfiles / pinned versions so a cache
  hit (the common case) restores in seconds instead of paying container pull
  + `cp -r node_modules` costs. Called independently by every E2E matrix
  shard; the first shard to reach each `actions/cache` step on a miss
  populates it, later shards on the same run reuse whatever finished first.

inputs:
  cache-key-suffix:
    description: >-
      Appended to every cache key used by this action. Used to force a
      cache miss (a "cold" run) for A/B experiments without disturbing the
      persistent cache namespace that normal runs rely on. Leave empty for
      normal use.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Use Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    # Firebase emulators require Java 21+. actions/setup-java restores from
    # the runner's pre-warmed toolcache (fast); without this,
    # install_os_utilities below falls back to downloading a JDK tarball from
    # adoptium on every shard, which is slow and network-dependent.
    - name: Use JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Configure npm global prefix
      shell: bash
      run: |
        mkdir -p "$HOME/.npm-global"
        npm config set prefix "$HOME/.npm-global"
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

    # pm2, tinylicious and dotenvx are already devDependencies of root/client
    # (see the PATH step below), so the only CLI that actually needs a global
    # install here is firebase-tools. It has no version pin in a lockfile, so
    # the cache key is a literal pin rather than a hash of a manifest -- bump
    # the "v1" suffix whenever the pinned version below changes.
    - name: Cache global npm tools
      id: cache-global-tools
      uses: actions/cache@v4
      with:
        path: ~/.npm-global
        key: e2e-global-tools-${{ runner.os }}-v1-firebase-tools${{ inputs.cache-key-suffix }}

    - name: Install global npm tools
      if: steps.cache-global-tools.outputs.cache-hit != 'true'
      shell: bash
      run: npm install -g firebase-tools

    - name: Cache npm dependency trees
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          client/node_modules
          server/node_modules
          functions/node_modules
        key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'client/package-lock.json', 'server/package-lock.json', 'functions/package-lock.json') }}${{ inputs.cache-key-suffix }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        npm_config_proxy: ''
        npm_config_https_proxy: ''
        # This runner has no pre-baked browser (unlike the Playwright base
        # image the container architecture used), so an unguarded postinstall
        # would download all three browser engines here and then again,
        # redundantly, in the pinned-chromium-only step below.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: |
        npm ci
        (cd client && npm ci)
        (cd server && npm ci)
        (cd functions && npm ci)

    - name: Link shared/node_modules
      shell: bash
      run: |
        if [ -f shared/package.json ] && [ -d client/node_modules ]; then
          ln -sfn ../client/node_modules shared/node_modules
        fi

    # pm2 (root devDependency) is invoked directly (not via `npm run`), so it
    # needs node_modules/.bin on PATH explicitly.
    - name: Add local node_modules/.bin to PATH
      shell: bash
      run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Cache Playwright browser
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: e2e-playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}${{ inputs.cache-key-suffix }}

    - name: Install OS packages and Playwright browser
      shell: bash
      env:
        ROOT_DIR: ${{ github.workspace }}
      run: |
        source scripts/common-config.sh
        source scripts/common-functions.sh
        install_os_utilities
