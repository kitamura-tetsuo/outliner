name: PoC Windows WSL2 Linux backend and native IME
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-wsl2-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provision-wsl2:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: archive/native-ime-2026-10-08-application
          path: work/native-ime-app
      - name: Verify historical application pin
        shell: powershell
        run: |
          $sha = git -C work/native-ime-app rev-parse HEAD
          if ($sha -ne '0b5e6b0b1d3985e6789a6d826c5a76a180642a6d') { throw "Unexpected historical application revision $sha" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attempt WSL2 Ubuntu and native Linux Docker Engine
        shell: powershell
        run: ./scripts/poc/windows-linux-backend/provision-wsl2.ps1
      - name: Start the pinned Linux backend through Compose and verify Windows localhost
        timeout-minutes: 30
        shell: powershell
        run: ./scripts/poc/windows-linux-backend/start-compose.ps1
      - name: Run unchanged native A-I and strict production J-K against Linux services
        timeout-minutes: 20
        shell: powershell
        env:
          OUTLINER_NATIVE_BACKEND: wsl2-linux
        run: ./scripts/poc/windows-native-ime/run.ps1
      - name: Collect Linux service diagnostics and stop Compose
        if: always()
        timeout-minutes: 2
        shell: powershell
        run: |
          $root = (Get-Location).Path.Replace('\', '/')
          $linuxRoot = '/mnt/' + $root.Substring(0,1).ToLower() + $root.Substring(2)
          wsl.exe --distribution Ubuntu --user root --exec bash "$linuxRoot/scripts/poc/windows-linux-backend/collect-compose.sh" "$linuxRoot/artifacts/windows-linux-backend"
      - name: Preserve exact platform and provisioning evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-wsl2-platform-${{ github.run_id }}
          path: |
            artifacts/windows-linux-backend/
            artifacts/windows-native-ime/
            !artifacts/windows-native-ime/firefox-profile/**
          if-no-files-found: error
          retention-days: 14
