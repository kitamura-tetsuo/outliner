name: Test E2E

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Direct ubuntu-latest architecture (issue #5166): no job-level container.
  # A job-level `container:` pays ~100s to pull/start a large Docker image on
  # every one of the 20 E2E shards before anything else can run, then another
  # ~80s copying node_modules trees out of it. This job instead builds the
  # server once and shares it as an artifact tied to the exact commit under
  # test; matrix shards restore dependencies from GitHub Actions cache
  # (populated here on a cache miss) which is materially cheaper than a
  # container pull + `cp -r`.
  prepare-e2e-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup E2E dependencies
        uses: ./.github/actions/setup-e2e-deps

      - name: Build server
        run: |
          cd server
          npm run build
          test -s dist/server/src/index.js

      - name: Upload server build artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-server-dist
          path: server/dist
          retention-days: 1

  e2e-test:
    needs: [prepare-e2e-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        project: [basic, core-1, core-2, core-3, core-4, core-4b, core-5, core-6, core-7, core-8, new-1, new-2, new-3, new-4, new-5, auth, utils, server, yjs, tables, schedule]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup E2E dependencies
        uses: ./.github/actions/setup-e2e-deps

      - name: Download server build artifact
        uses: actions/download-artifact@v6
        with:
          name: e2e-server-dist
          path: server/dist

      - name: Run E2E-specific startup (services + readiness)
        shell: bash
        run: bash scripts/ci-e2e-start.sh
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Run E2E tests (${{ matrix.project }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p job_logs
          cd client
          npm run github:test:e2e -- --project=${{ matrix.project }} 2>&1 | tee -a ../job_logs/e2e-${{ matrix.project }}.log
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../job_logs/e2e-${{ matrix.project }}.json
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ E2E Test Failed (${{ matrix.project }})" >> $GITHUB_STEP_SUMMARY
          if [ -f "job_logs/e2e-${{ matrix.project }}.log" ]; then
            grep -E -A1 -B0 "FAIL|FAILED" "job_logs/e2e-${{ matrix.project }}.log" >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Logs & Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.project }}
          path: |
            job_logs/
            client/test-results/
            client/playwright-report/
            client/logs/
            server/logs/
          retention-days: 2
