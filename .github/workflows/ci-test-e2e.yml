name: Test E2E

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      cache_bust:
        description: >-
          Appended to the E2E dependency/tool/Playwright cache keys. Set to
          a throwaway value (e.g. a run number) to force a cold-cache run
          for A/B experiments without disturbing the persistent cache
          namespace normal runs rely on. Leave empty for a normal run.
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No serialized prepare job (issue #5169): each shard restores its own
  # dependency / Playwright / global-tool caches and builds server/dist
  # locally, instead of waiting on a single upstream job. Measurements
  # (see the PR description for #5169) showed the previous prepare job's
  # actual server build was ~5s -- the artifact round-trip and the serial
  # `needs` gate cost far more than they saved, on both warm and cold
  # caches. `actions/cache` restores are safe to run concurrently across
  # shards: on a cache miss, whichever shard finishes `npm ci` /
  # Playwright install first just gets to be "first"; there is no shared
  # mutable state between shards.
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        project: [basic, core-1, core-2, core-3, core-4, core-4b, core-5, core-6, core-7, core-8, new-1, new-2, new-3, new-4, new-5, auth, utils, server, yjs, tables, schedule]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup E2E dependencies
        uses: ./.github/actions/setup-e2e-deps
        with:
          cache-key-suffix: ${{ github.event.inputs.cache_bust && format('-{0}', github.event.inputs.cache_bust) || '' }}

      - name: Build server
        run: |
          cd server
          npm run build
          test -s dist/server/src/index.js

      - name: Run E2E-specific startup (services + readiness)
        shell: bash
        run: bash scripts/ci-e2e-start.sh
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Run E2E tests (${{ matrix.project }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p job_logs
          cd client
          npm run github:test:e2e -- --project=${{ matrix.project }} 2>&1 | tee -a ../job_logs/e2e-${{ matrix.project }}.log
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../job_logs/e2e-${{ matrix.project }}.json
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ E2E Test Failed (${{ matrix.project }})" >> $GITHUB_STEP_SUMMARY
          if [ -f "job_logs/e2e-${{ matrix.project }}.log" ]; then
            grep -E -A1 -B0 "FAIL|FAILED" "job_logs/e2e-${{ matrix.project }}.log" >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload Logs & Artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.project }}
          path: |
            job_logs/
            client/test-results/
            client/playwright-report/
            client/logs/
            server/logs/
          retention-days: 2
