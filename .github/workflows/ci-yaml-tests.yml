name: YAML Test Coverage Check

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check-yaml-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check YAML test references
        run: |
          python3 - <<'PYEOF'
          import glob, os, yaml, sys
          missing=[]
          for f in sorted(glob.glob('docs/client-features/*.yaml')):
              with open(f) as fp:
                  d=yaml.safe_load(fp)
              if not isinstance(d,dict): continue
              specs=d.get('tests') or []
              if isinstance(specs,str): specs=[specs]
              for s in specs:
                  if isinstance(s,str) and not os.path.exists(s) and not glob.glob(s) and not glob.glob('**/'+os.path.basename(s), recursive=True):
                      missing.append((d.get('id'), os.path.basename(f), s))
          if missing:
              print("Error: Found dangling test references in feature YAML files:")
              for r in missing: print(r)
              sys.exit(1)
          else:
              print("All test references in feature YAML files are valid.")
              sys.exit(0)
          PYEOF
      - name: Guard against Fluid references in YAML
        run: |
          violations=$(grep -i "fluid" docs/client-features/*.yaml | grep -v "cbe-remove-fluid-token-endpoint-cbe91364.yaml" || true)
          if [ -n "$violations" ]; then
            echo "Error: Found 'Fluid' references in feature YAML files:"
            echo "$violations"
            exit 1
          fi
