name: Build Test Container

on:
  pull_request:
    paths:
      - '.github/container/Dockerfile'
      - '.github/workflows/build-container.yml'
      - 'scripts/install-test-container-os-packages.sh'
      - 'scripts/verify-test-container-os-tools.sh'
      - 'scripts/tests/test-container-os-packages.integration.sh'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/container/Dockerfile'
      - 'client/package-lock.json'
      - 'server/package-lock.json'
      - 'functions/package-lock.json'
      - 'shared/package.json'
      - 'scripts/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Exercise bounded OS-package acquisition
        run: bash scripts/tests/test-container-os-packages.integration.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/container/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify required OS tools in the built image
        if: github.event_name == 'pull_request'
        run: |
          docker tag "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}" outliner-test-container:ci
          docker run --rm outliner-test-container:ci \
            bash /cache/scripts/verify-test-container-os-tools.sh
