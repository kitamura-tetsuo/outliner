name: Playwright Version Check

on:
  workflow_call:
    outputs:
      sync_result:
        description: 'JSON result of the source-branch correction (outcome, repository, pr_number, source_ref, source_sha, result_sha); empty when no publication was attempted.'
        value: ${{ jobs.playwright-version.outputs.sync_result }}
  workflow_dispatch:

jobs:
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      sync_result: ${{ steps.publish.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No dependency install: both scripts only read the Dockerfile and the
      # lockfile, so the job stays fast enough to fail before the E2E shards start.
      #
      # The checkout above is the synthetic merge commit in detached HEAD, so the
      # correction is computed from, and pushed to, the PR's own source head as
      # named by the event payload. Fork PRs and push/manual runs never get here
      # and stay verification-only.
      - name: Publish the Playwright image correction to the PR source branch
        id: publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publish-playwright-sync.mjs

      - name: Re-run CI on the corrected head
        if: steps.publish.outputs.outcome == 'published'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REPOSITORY: ${{ steps.publish.outputs.repository }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
          RESULT_SHA: ${{ steps.publish.outputs.result_sha }}
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so close and
          # reopen the PR to start a run on the corrected head.
          gh pr close "$PR_NUMBER" --repo "$PR_REPOSITORY"
          gh pr reopen "$PR_NUMBER" --repo "$PR_REPOSITORY"
          # This run tested the old head; it must not go green.
          echo "::error::Published $RESULT_SHA; this run checked the previous head and is superseded by the run on the corrected head."
          exit 1

      # Always verifies the checked-out tree independently of the publisher, so
      # a correction that did not reach the branch cannot turn this job green.
      - name: Check the test container matches the client's Playwright version
        if: ${{ !cancelled() }}
        run: node scripts/check-playwright-version.mjs
