name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/architecture/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/architecture/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-guards:
    name: PR Guards
    uses: ./.github/workflows/ci-pr-guards.yml
    secrets: inherit

  format:
    name: Format Check and Auto-Fix
    uses: ./.github/workflows/ci-format.yml
    secrets: inherit

  checks:
    needs: format
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  unit-test:
    needs: [format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-unit.yml
    secrets: inherit

  integration-test:
    needs: [format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-integration.yml
    secrets: inherit

  e2e-test:
    needs: [format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-e2e.yml
    secrets: inherit

  eslint-client:
    name: Lint Code with ESLint
    uses: ./.github/workflows/ci-eslint.yml
    secrets: inherit

  yaml-tests-check:
    needs: format
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-yaml-tests.yml
    secrets: inherit

  lint-diff-lines:
    needs: format
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-lint-diff-lines.yml
    secrets: inherit
