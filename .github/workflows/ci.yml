name: CI

# A dispatch from the Playwright corrected-head handoff is named after the PR and
# commit it verifies, so the handoff can find (and reuse) it. Every other run
# keeps GitHub's default name.
run-name: "${{ inputs.pr_number && format('CI: PR #{0} corrected head {1}', inputs.pr_number, inputs.head_sha) || '' }}"

on:
  workflow_dispatch:
    inputs:
      # Set only by scripts/ci/request-corrected-head-ci.mjs (or its retry
      # workflow). They are a claim that PR Guards validates against the PR
      # record before anything else runs; a plain manual dispatch leaves them
      # empty and runs without PR context, as before.
      pr_number:
        description: 'Pull request whose head this run verifies (corrected-head handoff only)'
        required: false
        default: ''
        type: string
      head_sha:
        description: 'The PR head commit the run must be dispatched on (corrected-head handoff only)'
        required: false
        default: ''
        type: string
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/architecture/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/architecture/**'
      - '*.md'
      - '.gitignore'

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-guards:
    name: PR Guards
    uses: ./.github/workflows/ci-pr-guards.yml
    with:
      handoff_pr_number: ${{ inputs.pr_number }}
      handoff_head_sha: ${{ inputs.head_sha }}
    secrets: inherit

  format:
    name: Format Check and Auto-Fix
    needs: pr-guards
    uses: ./.github/workflows/ci-format.yml
    secrets: inherit

  checks:
    needs: [pr-guards, format]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  unit-test:
    needs: [pr-guards, format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-unit.yml
    secrets: inherit

  integration-test:
    needs: [pr-guards, format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-integration.yml
    secrets: inherit

  server-test:
    needs: [pr-guards, format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-server.yml
    secrets: inherit

  e2e-test:
    needs: [pr-guards, format, eslint-client]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-test-e2e.yml
    secrets: inherit

  docker-build:
    name: Docker Build
    needs: [pr-guards, format]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-docker-build.yml
    secrets: inherit

  eslint-client:
    name: Lint Code with ESLint
    needs: pr-guards
    uses: ./.github/workflows/ci-eslint.yml
    secrets: inherit

  yaml-tests-check:
    needs: [pr-guards, format]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-yaml-tests.yml
    secrets: inherit

  lint-diff-lines:
    needs: [pr-guards, format]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-lint-diff-lines.yml
    with:
      base_ref: ${{ needs.pr-guards.outputs.base_ref }}
    secrets: inherit

  playwright-version:
    name: Playwright Version Check
    needs: [pr-guards, format]
    if: needs.format.outputs.changes_pushed != 'true'
    uses: ./.github/workflows/ci-playwright-version.yml
    with:
      pr_number: ${{ needs.pr-guards.outputs.pr_number }}
      head_repository: ${{ needs.pr-guards.outputs.head_repository }}
      head_ref: ${{ needs.pr-guards.outputs.head_ref }}
      head_sha: ${{ needs.pr-guards.outputs.head_sha }}
    secrets: inherit
