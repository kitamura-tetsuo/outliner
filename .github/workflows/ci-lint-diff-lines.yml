name: Lint Diff Lines

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'PR base branch from the normalised PR context; empty for push/manual runs'
        required: false
        default: ''
        type: string

jobs:
  lint-diff-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: client
      - name: Lint changed lines
        env:
          BASE: ${{ format('origin/{0}', inputs.base_ref || github.event.repository.default_branch) }}
        run: npm run lint:diff-lines
        working-directory: client
