name: MCP Dependency Compatibility

on:
  workflow_call:
  workflow_dispatch:

jobs:
  mcp-dependency-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # The checker uses the pinned semver package from the repository root but
      # does not install the server tree. This keeps the guard small and lets it
      # reject an invalid MCP peer graph before the expensive CI fan-out starts.
      - name: Install compatibility-check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check MCP v2 peer compatibility
        run: node scripts/check-mcp-dependency-compat.mjs
