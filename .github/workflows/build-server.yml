name: Build and Push Server Container

on:
  push:
    branches:
      - main

# Only the newest commit on main is worth publishing: when a newer commit lands
# while an earlier build is still running, cancel the stale run so it cannot
# overwrite the `latest` tag with an older image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Build from the repo root: the server compiles the framework-neutral
          # schema from ../shared into its build, so shared/ must be in context.
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/yjs-ws-server:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/yjs-ws-server:latest
