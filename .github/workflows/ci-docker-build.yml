name: Docker Build

# The "Build and Push Server Container" workflow (build-server.yml) only runs on
# pushes to main, so a Dockerfile- or dependency-level breakage was invisible
# until after merge. These jobs build the same images on every PR (without
# pushing) so image breakage is caught before it reaches main.

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  server-image:
    name: Build server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          # Build from the repo root, matching build-server.yml: the server
          # compiles the framework-neutral schema from ../shared into its build,
          # so shared/ must be in context.
          context: .
          file: ./server/Dockerfile
          push: false
          load: true
          tags: yjs-ws-server:ci
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Verify native modules load in the built image
        # better-sqlite3 is compiled from source during the image build. A
        # successful build does not prove the binding loads, so exercise it.
        run: |
          docker run --rm -w /usr/src/app/server yjs-ws-server:ci node -e "
            if (process.versions.node.split('.')[0] !== '26') {
              throw new Error('Expected Node 26, got ' + process.version);
            }
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE t (a INTEGER)');
            db.prepare('INSERT INTO t VALUES (1)').run();
            const { c } = db.prepare('SELECT COUNT(*) AS c FROM t').get();
            if (c !== 1) throw new Error('unexpected row count: ' + c);
            console.log('better-sqlite3 binding OK');

            const admin = require('firebase-admin');
            const { getFirestore, FieldValue } = require('firebase-admin/firestore');
            admin.initializeApp({ projectId: 'dummy-project' });
            const firestore = getFirestore();
            const coll = firestore.collection('dummy');
            const doc = coll.doc('dummy-id');
            const ts = FieldValue.serverTimestamp();
            console.log('firebase-admin/firestore binding OK');
            console.log('Node version: ' + process.version);

            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('node_modules/firebase-admin/package.json', 'utf8'));
            console.log('Admin version: ' + packageJson.version);
            const adminV = packageJson.version.split('.').map(Number);
            if (adminV[0] !== 14 || adminV[1] < 4) {
              console.error('Firebase Admin version out of range: ' + packageJson.version);
              process.exitCode = 1;
              throw new Error('Admin version must be >=14.4.0 and <15.0.0');
            }

            const fsPackageJson = JSON.parse(fs.readFileSync('node_modules/@google-cloud/firestore/package.json', 'utf8'));
            console.log('Firestore version: ' + fsPackageJson.version);
            const fsV = fsPackageJson.version.split('.').map(Number);
            if (fsV[0] !== 9 || fsV[1] < 2) {
              console.error('Firestore version out of range: ' + fsPackageJson.version);
              process.exitCode = 1;
              throw new Error('Firestore version must be >=9.2.0 and <10.0.0');
            }
          "

      - name: Verify both SQLite bindings and SQL engines in the built image
        run: |
          docker run --rm --network none --workdir /usr/src/app \
            --mount "type=bind,src=$PWD/scripts/ci/node26-committed-image-smoke.mjs,dst=/tmp/node26-data-smoke.mjs,readonly" \
            yjs-ws-server:ci node /tmp/node26-data-smoke.mjs

      - name: Verify the default cloud server starts on Node 26
        run: |
          docker run -d --name yjs-ws-server-smoke \
            -e ALLOW_ALL_ORIGINS=true \
            -e DISABLE_JOB_SCHEDULER=true \
            -e FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:59099 \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:58080 \
            -e FIREBASE_PROJECT_ID=outliner-d57b0 \
            -e VITE_FIREBASE_API_KEY=emulator-key \
            -e VITE_FIREBASE_AUTH_DOMAIN=outliner-d57b0.firebaseapp.com \
            -e VITE_FIREBASE_PROJECT_ID=outliner-d57b0 \
            -e VITE_FIREBASE_APP_ID=1:0:web:emulator \
            -e OAUTH_ACCESS_TOKEN_SECRET=container-smoke-secret \
            -e OAUTH_ISSUER=http://127.0.0.1:7093 \
            yjs-ws-server:ci
          trap 'docker rm -f yjs-ws-server-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec yjs-ws-server-smoke node -e "
              (async () => {
                if (process.versions.node.split('.')[0] !== '26') {
                  throw new Error('Expected Node 26, got ' + process.version);
                }
                const health = await fetch('http://127.0.0.1:7093/health');
                if (!health.ok) throw new Error('Health status ' + health.status);
                const deployment = await fetch('http://127.0.0.1:7093/api/deployment');
                if (!deployment.ok) throw new Error('Deployment status ' + deployment.status);
                const body = await deployment.json();
                if (body.deploymentMode !== 'cloud') {
                  throw new Error('Expected cloud deployment, got ' + JSON.stringify(body));
                }
              })();
            "; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' yjs-ws-server-smoke)" != true ]; then
              echo 'Cloud server exited before becoming ready' >&2
              docker logs yjs-ws-server-smoke
              exit 1
            fi
            sleep 1
          done

          docker logs yjs-ws-server-smoke
          exit 1

  server-debug-image:
    name: Build server debug image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server debug image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile.debug
          push: false
          load: true
          tags: yjs-ws-server:ci-debug
          cache-from: type=gha,scope=server-debug-image
          cache-to: type=gha,mode=max,scope=server-debug-image

      - name: Verify native modules load in the built image
        run: |
          docker run --rm -w /usr/src/app/server yjs-ws-server:ci-debug node -e "
            if (process.versions.node.split('.')[0] !== '26') {
              throw new Error('Expected Node 26, got ' + process.version);
            }
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE t (a INTEGER)');
            db.prepare('INSERT INTO t VALUES (1)').run();
            const { c } = db.prepare('SELECT COUNT(*) AS c FROM t').get();
            if (c !== 1) throw new Error('unexpected row count: ' + c);
            console.log('better-sqlite3 binding OK');

            const admin = require('firebase-admin');
            const { getFirestore, FieldValue } = require('firebase-admin/firestore');
            admin.initializeApp({ projectId: 'dummy-project' });
            const firestore = getFirestore();
            const coll = firestore.collection('dummy');
            const doc = coll.doc('dummy-id');
            const ts = FieldValue.serverTimestamp();
            console.log('firebase-admin/firestore binding OK');
            console.log('Node version: ' + process.version);

            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('node_modules/firebase-admin/package.json', 'utf8'));
            console.log('Admin version: ' + packageJson.version);
            const adminV = packageJson.version.split('.').map(Number);
            if (adminV[0] !== 14 || adminV[1] < 4) {
              console.error('Firebase Admin version out of range: ' + packageJson.version);
              process.exitCode = 1;
              throw new Error('Admin version must be >=14.4.0 and <15.0.0');
            }

            const fsPackageJson = JSON.parse(fs.readFileSync('node_modules/@google-cloud/firestore/package.json', 'utf8'));
            console.log('Firestore version: ' + fsPackageJson.version);
            const fsV = fsPackageJson.version.split('.').map(Number);
            if (fsV[0] !== 9 || fsV[1] < 2) {
              console.error('Firestore version out of range: ' + fsPackageJson.version);
              process.exitCode = 1;
              throw new Error('Firestore version must be >=9.2.0 and <10.0.0');
            }
          "

      - name: Verify both SQLite bindings and SQL engines in the debug image
        run: |
          docker run --rm --network none --workdir /usr/src/app \
            --mount "type=bind,src=$PWD/scripts/ci/node26-committed-image-smoke.mjs,dst=/tmp/node26-data-smoke.mjs,readonly" \
            yjs-ws-server:ci-debug node /tmp/node26-data-smoke.mjs
