name: Devcontainer Firebase smoke

on:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/docker-compose.yml'
      - 'firebase.emulator.json'
      - 'scripts/require-java-21.sh'
      - 'scripts/smoke-test-devcontainer-firebase.sh'
      - '.firebase-tools-version'
      - '.github/workflows/ci-devcontainer-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-emulators:
    name: Firebase Auth, Firestore, and Storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build the supported devcontainer image
        run: docker build --tag outliner-devcontainer-firebase --file .devcontainer/Dockerfile .

      - name: Start and probe real Firebase emulators
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            outliner-devcontainer-firebase \
            bash scripts/smoke-test-devcontainer-firebase.sh
