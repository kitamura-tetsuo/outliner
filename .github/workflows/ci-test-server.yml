name: Test Server

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env

      - name: Run server tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p job_logs
          cd server
          npm test 2>&1 | tee -a ../job_logs/server-test.log
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          DISPLAY: :99
          DISABLE_POSTHOG: true
          VITE_DISABLE_FLUID_TELEMETRY: true

      - name: Summarise failures
        if: failure()
        run: |
          echo "## ❌ Server Test Failed" >> $GITHUB_STEP_SUMMARY
          if [ -f "job_logs/server-test.log" ]; then
            grep -E -A1 -B0 "failing|FAIL|FAILED" "job_logs/server-test.log" >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: server-test-logs
          path: job_logs/
          retention-days: 2

  project-directory-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Test Environment
        uses: ./.github/actions/setup-test-env

      - name: Run canonical project directory tests
        shell: bash
        run: |
          cd server
          TS_NODE_TRANSPILE_ONLY=1 \
            NODE_OPTIONS="--loader ts-node/esm --loader ./tests/loaders/pin-server-deps.mjs --no-warnings" \
            npx mocha tests/project-directory.test.ts --timeout 10000
        env:
          CI: true
          NODE_ENV: test
          TEST_ENV: localhost
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:58080
          FIREBASE_PROJECT_ID: outliner-d57b0
          GCLOUD_PROJECT: outliner-d57b0
