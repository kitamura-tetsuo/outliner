version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
      svelte-core:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "vite"
      # Keep the Playwright packages on one version. They share a browser
      # registry, so bumping one alone leaves the runner asking for a browser
      # revision nothing installed -- every E2E shard then dies at
      # browserType.launch. Grouping makes Dependabot move them together in a
      # single PR. @playwright/mcp and mcp-playwright are deliberately excluded:
      # they version independently of the test runner.
      playwright:
        patterns:
          - "playwright"
          - "playwright-core"
          - "@playwright/test"

  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
    ignore:
      # Hold TypeScript on the 6.x line for the server package.
      # ts-jest (used by jest.config.js for the scheduler jest tests) declares a
      # peer dependency of `typescript@">=4.3 <7"`, so bumping to TypeScript 7
      # breaks `npm ci` with ERESOLVE before any test runs. TypeScript 7 also
      # ships the native (tsgo) compiler without the classic JS compiler API that
      # ts-jest relies on. Remove this ignore once ts-jest publishes a release
      # that supports TypeScript 7 (expected around the TS 7.1 API).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  - package-ecosystem: 'npm'
    directory: '/scripts'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  # The E2E test container's base image. It ships the browser bundle for exactly
  # one Playwright release, so it has to move whenever client/package-lock.json
  # moves -- and until now nothing watched it: the image sat on v1.61.1 while
  # Dependabot took @playwright/test to 1.62.0, and every E2E shard died at
  # browserType.launch. Watching the image here means a new Playwright release
  # shows up as a pull request instead of as a silent drift.
  #
  # Dependabot cannot group across ecosystems, so this arrives as its own pull
  # request alongside the npm `playwright` group above, and neither one passes
  # scripts/check-playwright-version.mjs on its own -- by design, since either
  # half alone is the broken state. Land them as one change: apply the base
  # image bump onto the npm branch, then close this pull request.
  - package-ecosystem: 'docker'
    directory: '/.github/container'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'docker'

  - package-ecosystem: 'npm'
    directory: '/scripts/tests'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
