version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
      svelte-core:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "vite"

  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
    ignore:
      # Hold TypeScript on the 6.x line for the server package.
      # ts-jest (used by jest.config.js for the scheduler jest tests) declares a
      # peer dependency of `typescript@">=4.3 <7"`, so bumping to TypeScript 7
      # breaks `npm ci` with ERESOLVE before any test runs. TypeScript 7 also
      # ships the native (tsgo) compiler without the classic JS compiler API that
      # ts-jest relies on. Remove this ignore once ts-jest publishes a release
      # that supports TypeScript 7 (expected around the TS 7.1 API).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  - package-ecosystem: 'npm'
    directory: '/scripts'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"

  - package-ecosystem: 'npm'
    directory: '/scripts/tests'
    schedule:
      interval: 'weekly'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 10
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      typescript-and-lint:
        patterns:
          - "typescript"
          - "*eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "*prettier*"
