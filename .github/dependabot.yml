version: 2

# Scheduling policy
#
# Every npm directory used to be its own `updates` entry on a weekly schedule at
# the same time, so all seven fired in the same minute and a week's worth of
# releases landed as one burst -- 19 pull requests inside five minutes on
# 2026-08-10, which is more than CI can drain before the next batch arrives.
#
# Two changes fix that:
#
#   1. `interval: daily`. Weekly does not reduce the number of updates, it only
#      accumulates them; each release still gets a pull request, they just all
#      arrive together. Daily hands CI one release-day's worth at a time.
#   2. One entry listing every npm directory under `directories`, combined with
#      groups. The same dependency version bump across /client, /server and
#      /scripts is one change, and grouped updates span the listed directories,
#      so it arrives as one pull request touching several lockfiles instead of
#      one pull request per directory.
#
# The trailing `minor-and-patch` catch-all group collects everything the named
# groups above it do not claim -- groups are matched in declaration order, so
# the specific ones must stay first. Major bumps stay ungrouped and get their
# own pull request: those are the ones that need to fail in isolation.
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/client'
      - '/server'
      - '/functions'
      - '/scripts'
      - '/scripts/tests'
    schedule:
      interval: 'daily'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 5
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      # Keep the Playwright packages on one version. They share a browser
      # registry, so bumping one alone leaves the runner asking for a browser
      # revision nothing installed -- every E2E shard then dies at
      # browserType.launch. Grouping makes Dependabot move them together in a
      # single PR. @playwright/mcp and mcp-playwright are deliberately excluded:
      # they version independently of the test runner.
      playwright:
        patterns:
          - 'playwright'
          - 'playwright-core'
          - '@playwright/test'
      svelte-core:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'vite'
      typescript-and-lint:
        patterns:
          - 'typescript'
          - '*eslint*'
          - '@typescript-eslint/*'
          - 'prettier'
          - '*prettier*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7.0 removes the classic JavaScript compiler API before its
      # replacement is ready, and ts-jest (used by server/jest.config.js for the
      # scheduler tests) declares a peer dependency of `typescript@">=4.3 <7"`,
      # so bumping to TypeScript 7 breaks `npm ci` with ERESOLVE before any test
      # runs. This was a per-directory ignore for /client and /server; with the
      # directories merged it applies everywhere, which is also what the
      # typescript-and-lint group wants -- a single TypeScript version across
      # the repository. Remove it once ts-jest publishes a release that supports
      # TypeScript 7 (expected around the TS 7.1 API). Restricting the rule to
      # the 7.0 release line lets Dependabot resume at 7.1.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0 <7.1.0'

  # The E2E test container's base image. It ships the browser bundle for exactly
  # one Playwright release, so it has to move whenever client/package-lock.json
  # moves -- and until now nothing watched it: the image sat on v1.61.1 while
  # Dependabot took @playwright/test to 1.62.0, and every E2E shard died at
  # browserType.launch. Watching the image here means a new Playwright release
  # shows up as a pull request instead of as a silent drift.
  #
  # Dependabot cannot group across ecosystems, so this arrives as its own pull
  # request alongside the npm `playwright` group above, and neither one passes
  # scripts/check-playwright-version.mjs on its own -- by design, since either
  # half alone is the broken state. Land them as one change: apply the base
  # image bump onto the npm branch, then close this pull request.
  - package-ecosystem: 'docker'
    directory: '/.github/container'
    schedule:
      interval: 'daily'
      time: '13:00' # UTC. Equivalent to 22:00 JST
    open-pull-requests-limit: 5
    rebase-strategy: 'auto'
    labels:
      - 'dependencies'
      - 'docker'
