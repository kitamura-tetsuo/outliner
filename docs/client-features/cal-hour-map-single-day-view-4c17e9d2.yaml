id: FTR-4c17e9d2
title: Hour Map single-day calendar view (hour x minute matrix)
title-ja: 時×分マトリクスの1日カレンダービュー（アワーマップ）
description: 'A single-day calendar view (`viewType: hours`, labelled "Hour Map") that lays time out as an hour x minute map instead of a vertical time column: the y axis is one row per wall-clock hour (00-23) and the x axis inside each row is that hour''s minutes (00-60). A timed entry is clipped to the visible local day, split at local hour boundaries, and rendered as one ordinary DOM fragment per hour it touches, so a 09:45-11:20 meeting reads as three connected pieces on the 09, 10 and 11 rows — a narrow text box folded every hour. Horizontal position and width always mean elapsed minutes and are never repurposed for overlap layout, so overlapping entries stack into vertical sub-lanes and only the affected hour rows grow taller; lanes are assigned once over the whole visible day by a deterministic greedy first-fit, so a multi-hour entry keeps the same lane in every row it touches while non-overlapping entries reuse a lane. The event title renders once per entry: in the first fragment with room for it, otherwise the earliest later fragment wide enough (a documented 15-minute threshold), and when no fragment qualifies the entry keeps a focusable, screen-reader-visible label with no inline text. Adjacent fragments of one entry read as a single wrapped object through continuation styling (flattened inner corners plus a continuation marker), the resize handle sits only on the final fragment, and the title/delete affordance only on the anchor fragment. Move and resize drags cross hour boundaries naturally — horizontal travel is minutes, vertical travel is whole hour rows, and the two resolve into one continuous wall-clock destination, so a 10:50 entry dragged 20 minutes later becomes 11:10 rather than clamping at 10:59 — and both go through the existing calendar write contract: the view reports proposed start/duration to CalendarView and never writes Yjs itself, keeping optimistic placement, writability gating, the drag destination chip, undo and requery behaviour identical to the time grid. Arrow keys match the existing 15-minute interaction model along this view''s own axes (Left/Right steps minutes, Up/Down steps an hour row; the resize handle does the same to the end instant). Hour rows are derived from the calendar''s own timezone through the DST-safe wall-clock conversion, never by adding fixed UTC hours to midnight: rows are walked forward across the day so they tile it exactly, a wall hour the clock skipped gets no row at all, a wall hour the clock repeated gets two rows with the same label (the second marked as the repeat, so neither pass is drawn at a distorted minute scale), and a zone whose transition falls mid-hour keeps the surviving part as a partial row occupying only its real slice of the 00-60 axis. No event is lost, duplicated, mislabelled or written an hour off. Day navigation moves by one local calendar day and queries exactly the same one-day range as the existing day view. All-day entries and due-only milestones stay out of the hour geometry in their own band, and the configured working-hours interval is shown proportionally along the minute axis of the rows it covers. Existing day/multi-day/week/month/Gantt views are untouched.

  '
