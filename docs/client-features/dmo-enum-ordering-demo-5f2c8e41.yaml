acceptance:
- /demo and /demo-ja seed a Project catalog ENUM with stable reseed identity plus a separate Table whose column uses that ENUM
- Existing Tasks and Table records, default Grid queries, unrelated demo content and the CASE-based priority demo are preserved
- The catalog source participates in the demo template fingerprint and reset lifecycle so reseeds converge without duplicating definitions, Tables or Grids
- The example is reachable from the locale feature-tour navigation and shows the actual catalog source and Grid query with localized Project-TYPE-ownership versus Grid-sorting guidance
- The seeded Grid query is an ordinary SQL ORDER BY on the ENUM column whose row order visibly differs from lexical text order
- Viewing the example requires no anonymous catalog-write authority
