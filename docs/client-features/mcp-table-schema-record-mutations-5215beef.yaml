id: FTR-5215beef
title: Safe MCP Table schema and record mutations
title-ja: 安全な MCP Table スキーマ・レコード変更操作
status: implemented
description: 'Two bounded, write-scoped MCP tools extend the shared mutation-safety contract (expectedRevision, operationId, dryRun) to Tables. update_table_schema migrates a Table''s schema through the exact same dry-run validator exposed by validate_table_schema, then applies it in one Yjs transaction that replaces the schema text and strips any removed columns from every record together, so a half-migrated schema/data pair is never observable; a migration that removes or retypes a column is destructive and is rejected with destructive_confirmation_required unless the call also sets acknowledgeDestructive: true (a dry run always reports the diff without needing it). Unlike write_relation and set_view_query, this transaction uses the default (untracked) origin so a live client''s own Y.UndoManager for the Table can undo an MCP-applied migration like any other local edit. update_table_records writes a batch of record changes addressed only by stable record ID (never by displayed row index, and never creating a new record) atomically: the whole batch is validated against the Table''s real schema constraints (NOT NULL, CHECK, UNIQUE) before anything is written, using a materialized before/after comparison so a change is rejected both when it makes the changed record itself invalid and when it would newly break a constraint on an untouched record elsewhere in the Table. Both tools share one expectedRevision covering the whole Table (schema plus every record), so a batch can never silently land over a concurrent collaborator''s edit. This makes it possible to safely populate a newly added ordering column across a bounded set of records without index-based writes -- rewriting record values this way is documented as distinct from Grid display order, which still requires an explicit query/presentation sort.'
tests:
- server/tests/demo-seed-content.test.ts
- server/tests/mcp-mutation-contract.test.ts
- server/tests/mcp-relation-service.test.ts
