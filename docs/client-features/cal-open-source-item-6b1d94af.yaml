id: FTR-6b1d94af
title: Open a calendar event's source outline item on double-click
title-ja: カレンダーの予定をダブルクリックして元のアウトライン項目を開く
description: 'Double-clicking a calendar event navigates to the outline item the event was projected from and brings that item into view and focus. Which item that is comes from the entry''s own stable identity (`source_kind` / `source_id`, already carried by every `CalendarEntry`), never from matching the event''s title text, so a recurrence occurrence opens the underlying source or override item exactly as its row names it. A single shared `navigateToOutlineItem(project, sourceId)` primitive owns the whole path — page resolution, routing, expansion, focus — and every event renderer merely reports the double-click to it: timed and all-day cards and due milestones in the day / multi-day / week time grid, the grouped swimlane view built from it, month-view chips and milestones, hour-map fragments, and Gantt bars, start points and due markers (a roll-up bar included, since the entry under it is a concrete parent item). The primitive resolves the owning page and ancestor path from the project tree, never by scanning rendered DOM or inferring a page from a title: it walks the item''s parents to the top-level item that owns it. When the source already lives on the open page nothing routes — the page is not re-resolved or reloaded — and only the reveal step runs; otherwise it navigates through SvelteKit `goto` on the canonical project/page route built by the repository''s existing route helpers, so a page whose title contains non-ASCII or reserved characters is percent-encoded the same way every other navigation encodes it. After the destination page is ready — waited for through DOM mutations rather than a fixed delay, since how long a page takes to render is a sync question — any collapsed ancestors are expanded through the outliner''s own view model (not by mutating DOM classes), the item is scrolled into view, and the caret and active-item state move to that exact item through the normal cursor handling. Both of those steps are addressed to the tree that actually renders the owning page, which an expanded alias otherwise makes ambiguous: an alias mounts a second, embedded tree over its target, so it can both claim the globally "active" view model and duplicate the target''s `data-item-id` earlier in the document. Expansion therefore goes through a controller the page-level tree registers for itself (and which pairs the collapse change with the display-list rebuild, since the view model''s own partial recalculation can be skipped by a later non-structural update), and the scroll target is the first matching row outside every embedded tree. A row that does not map to an outline item never pretends to be navigable: because `source_kind` is a query-chosen literal rather than an enum, the test for navigability is that the row''s `source_id` resolves to a live node of the project tree, which a table-derived row''s identity and a concurrently deleted item''s identity both fail — such rows carry no navigable affordance and double-clicking them does nothing and throws nothing. Gesture ownership stays explicit: the double-click is stopped at the entry so it never reaches the outliner item hosting the calendar block and starts editing there, and a press that releases without travelling is treated as a click rather than a zero-distance reschedule, so the second press of a double-click cannot commit a move. Drag, resize, keyboard movement, lane drag-and-drop and the delete affordance are otherwise unchanged; a resize released without travelling still commits the drawn duration, as before.

  '
