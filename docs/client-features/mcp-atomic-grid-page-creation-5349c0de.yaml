id: FTR-5349c0de
title: Atomic server Grid creation with Page placement
title-ja: ページ配置を伴うサーバー側グリッドのアトミック作成
status: implemented
description: The server relation service can create one source-independent Grid defined by its SELECT and append one Grid placement to the end of an existing top-level Page as a single all-or-nothing mutation. The candidate SELECT is validated with the same executable Grid query semantics as validate_grid_query before any write, actual SQL sources, destination Page, and validation inputs are re-resolved at the synchronous mutation boundary (revalidating when they changed), concurrent peer edits are preserved, and a failed publication leaves neither a Grid definition nor a placement. Exposed by the create_grid MCP mutation (FTR-5350c0de).
