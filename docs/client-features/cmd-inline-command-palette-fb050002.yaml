id: CMD-0001
title: Inline Command Palette
title-ja: インラインコマンドパレット
description: Type '/' within an item to open a palette for inserting Database or Alias commands.
category: editing
status: implemented
components:
- client/src/components/SlashCommandPalette.svelte
tests:
- client/e2e/core/slr-slash-command-palette-visibility.spec.ts
- client/e2e/basic/cmd-inline-command-palette-fb050002.spec.ts
acceptance:
- Typing '/' with focus on an item shows the command palette with 'Database' and 'Alias'
- Typing a filter such as 'al' narrows the command list to 'Alias'
- ArrowDown/ArrowUp keys move the aria-selected attribute between options
- Escape closes the palette and leaves the item text unchanged
- Backspace with an empty query removes the '/' and leaves the item text byte-identical to before
- Typing '/' immediately after '[' does not open the palette