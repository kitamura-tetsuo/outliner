id: FTR-2e6b9f14
title: Standalone Table, Grid and Schedule entities
title-ja: Table・Grid・Schedule の独立エンティティ化
description: 'Table, Grid and Schedule are three independent entities and each has a URL whose subject matches the page. A Table owns schema and data: /<project>/-/tables/<tableId> shows the schema editor and a raw, editable data browser driven by an implicit and ephemeral `SELECT * FROM <sqlName>`, never a persisted Grid. Opening a Table never creates or selects a Grid; the resolve-or-create bridge (`ensureGridForTable`) is removed, so a Table with zero Grids is fully viewable and editable. The Table page lists the Grids whose `sourceTableId` points at it, as links to /<project>/-/grids/<gridId>, and the Schedules that reference it, as links to /<project>/-/schedules/<ruleId> — reference lists, not child lists, and no Grid result is mounted on the Table page. A Grid owns its SELECT, column order, labels, hidden columns, cell component settings and chart over one source Table; /<project>/-/grids/<gridId> renders exactly that and links back to the source Table instead of owning its schema, with an explicit missing-source state when the Table is gone. A Schedule is a project-level entity: it may reference several Tables (a write target plus whatever its SQL reads), so it is addressed at /<project>/-/schedules/<ruleId>, listed at /<project>/-/schedules, and appears in the dependency list of every Table it references. The old Table-nested schedule URL only forwards to the project-level list.'
