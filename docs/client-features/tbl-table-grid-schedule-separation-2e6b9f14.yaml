acceptance:
- /<project>/-/grids/<gridId> renders that Grid's own query, presentation and result
- /<project>/-/tables/<tableId> is a page about the Table entity, showing its schema and its raw rows
- A Grid page links back to its source Table and shows an explicit missing-source state when the Table is gone
- A Schedule is addressable at the project level and may reference several Tables without one owning it
- A Table with zero Grid entities is still viewable and editable
- A persisted Table opened directly on a cold standalone route restores its schema and rows from its Table subdoc room
- A public-demo visitor may read the project schedule list but cannot run or delete a rule
- Edits made in the raw data browser write directly to the Table through the Table write paths
- Every Table a Schedule references reports it in its dependency/reference list
- Opening a Table never creates a Grid and never mutates the Grid registry
- Table data edits propagate to every Grid result and embedded Grid block
- The Table data browser runs an implicit `SELECT * FROM <sqlName>` and persists no query or presentation state
- The Table page lists every Grid whose sourceTableId is the Table, as links, without mounting their results
- The demo occurrences table page shows raw data plus links to both of its Grids
- The project schedule list follows a table rename made while it is open
- The table deletion dialog reports Grids and Schedules as dependencies rather than as contents
- Two Grids over one Table stay independent on their standalone pages
