id: FTR-2e6b9f14
title: Standalone Table, Grid and Schedule entities
title-ja: Table・Grid・Schedule の独立エンティティ化
description: Table, Grid and Schedule are independent project entities. A Table owns schema and raw records; its standalone page offers CREATE TABLE editing and an implicit, ephemeral SELECT * browser without creating a Grid. Its Grid reference list follows actual current SQL dependencies. A Grid owns its identity, SELECT, labels, order, visibility, widths, component settings and charts. Embedded and standalone Grids use the same primary-independent Project SELECT runtime over zero, one or several Tables or outline_items. They link to actual dependencies or report empty/unavailable dependencies, and keep broken-query editing accessible. Existing-row effects use verified physical sources, while Add row uses the independent guarded INSERT resolver. Grid presentation metadata never establishes mutation authority. Schedules remain project-level objects with their own write targets and SQL dependencies; the retired Table-nested Schedule URL forwards to the project Schedule list.
