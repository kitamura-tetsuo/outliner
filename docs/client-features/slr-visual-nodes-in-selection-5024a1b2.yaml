acceptance:
- A Calendar strictly between the endpoints is rendered as a selected node
- A Grid strictly between the endpoints is rendered as a selected node
- A Layout is rendered as one selected container, never as its children's separate rectangles
- A selected visual node exposes a stable data-selection-item-id fragment for geometry assertions
- A visual node the selection merely stops at stays unselected, keeping the text endpoint model
- Forward and reverse drags over the same range produce the same node and text geometry
- Grid, Calendar and Layout need no hidden or placeholder text to participate in selection rendering
- Selection inside a block's own inputs stays the block's, and draws no outline selection
- Text nodes keep character-level selection geometry at both endpoints of a mixed selection
- The node highlight tints and outlines the block instead of covering it with the character fill
- The plain-text clipboard flavor invents no caption for a textless visual node
- The structured clipboard payload includes selected visual nodes and their bindings
- Wrapped and formatted text selection behavior is unchanged
