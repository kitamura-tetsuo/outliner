acceptance:
- /Calendar follows the same replacement semantics
- /Grid on an eligible empty Text node deletes that node and inserts a fresh Grid node at the same sibling position
- /Layout follows the same replacement semantics
- A Calendar node exposes no ordinary item text field
- A Grid node exposes no ordinary item text field and typing on it creates no hidden item text
- A Layout node exposes no ordinary item text field
- A Text node renders and edits its outline text exactly as before, and may still own normal outline children
- A drag/drop or indent that would parent content under a Grid or Calendar is rejected and leaves the tree unchanged
- A page-title node is never replaced by a visual node
- Calendar nodes cannot accept children
- Copying a Grid or Calendar carries its binding but no ordinary outline text, while other applications still receive the entity's display name
- Embedded Grid, Calendar and Layout functionality is unchanged by the removal of item text and type conversion
- Grid nodes cannot accept children
- Layout accepts Grid and Calendar children, rejects ordinary Text children, and nested Layout stays invalid
- Pasting a payload that gives a visual node outline text or children is refused
- Remove layout / Unwrap still moves the visual children to the Layout's parent, in order, with their bindings intact
- Slash replacement never discards text the user typed beside the command, nor a node's children
- Slash replacement never mutates an existing node's kind in place
- Stale text left on a visual node is never shown as a caption or used as its accessible name
- The item context menu no longer offers Text <-> Calendar conversion
- The item context menu no longer offers Text <-> Grid conversion
- The item context menu no longer offers Text <-> Layout conversion
- Undo treats a slash replacement as one coherent structural operation
