id: FTR-5015a1b2
title: Immutable outline node kinds with text owned only by Text nodes
title-ja: アウトラインノード種別の不変化とテキストのテキストノード専有
description: 'An outline node has exactly one stable semantic kind — Text, Grid, Calendar or Layout — decided when the node is created and never changed afterwards. A visual node is not a Text node with extra rendering state. Text nodes own editable outline text and may have normal outline children. Grid and Calendar nodes bind to their entity, own no ordinary outline text and are leaves. Layout owns no text either and is a container for allowed visual children only, with nested Layout still invalid. The kind stays stored in the pre-existing `componentType` field, now treated as an exclusive discriminator rather than a decoration: a single framework-neutral registry (`shared/src/services/outlineNodeKind.ts`) maps it to a kind and answers `isTextNode`, `isVisualNode`, `canNodeHaveChildren` and `canAcceptChild`, so the rules live in one place instead of scattered `componentType === "yjstable"` comparisons. The Yjs schema enforces two of them itself: `Item.updateText` collapses any write on a visual node to the empty string and `Item.text` reads as empty for one, so typing, pasting or stale development data can never give a block a hidden caption; and the `componentType` setter accepts a write only while the node is still blank, so no code path can retype a node in place. Persistent type-conversion UI is gone — the item context menu no longer offers Change to Database/Calendar/Text/Layout and is kind-aware instead, keeping only actions valid for the selected kind plus the Layout-specific "Remove layout (keep blocks)", which stays a structural unwrap rather than a kind change. Creation happens through dedicated slash commands (/Grid, /Calendar, /Layout, with /database and /table still matching Grid), and slash creation looks like conversion while being implemented as replacement: an eligible empty Text node — a normal, non-page-title node with no children and no content left once the command string is removed — is deleted and a freshly created visual node is inserted at the same parent and sibling index, inside one Yjs transaction so collaboration and undo see a single structural operation. A node that still holds text or children is never discarded; the new block is inserted next to it instead. Tree constraints are enforced centrally on every structural path — item drag & drop (nesting and sibling drops), indent, programmatic moves and paste — so an invalid parenting cannot exist merely because the renderer does not draw it. Clipboard semantics follow: copying a Grid or Calendar carries the binding but no outline text, the entity display name reaches other applications through the outward plain-text/HTML flavors only, a payload that gives a visual node text or children is rejected on paste, and pasting a block into an item creates a new node rather than retyping the caret''s own node. Cutting a selection whose surviving first item is a block removes that block instead of stripping it back to a Text node. No schema rename and no migration framework is introduced; demo content and fixtures are updated to produce valid nodes directly, with a preceding Text node acting as each block''s heading.

  '
