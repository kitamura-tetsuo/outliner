- client/e2e/core/itm-boundary-branch-keyboard-5794b2c3.spec.ts
- client/e2e/core/itm-backspace-visual-boundary-5794c4d5.spec.ts
- client/src/tests/integration/cursor/itm-boundary-descendant-preservation-5794.integration.spec.ts
