id: IME-c4e7a2d9
title: Shared input proxy does not soft-wrap during IME composition
title-ja: 共有入力テキストエリアはIME変換中もソフト折り返ししない
category: input-method
status: implemented
tests:
- client/e2e/core/ime-proxy-no-wrap-document-layout-c4e7a2d9.spec.ts
- client/e2e/core/ime-proxy-no-wrap-editing-results-c4e7a2d9.spec.ts
- client/e2e/core/ime-proxy-textarea-no-soft-wrap-c4e7a2d9.spec.ts
- scripts/native-ime-regression/ubuntu/regression.py
- scripts/native-ime-regression/ubuntu/test_verdict.py
acceptance:
- A logical line wider than the proxy is laid out on one row inside the proxy (no soft-wrapped rows), so Firefox + Fcitx5 anchors the native candidate window to the inline preedit instead of a wrapped internal row (#5501)
- Confirming or cancelling a composition at one or more local carets yields the same text and caret results as before
- Native verification is automated by .github/workflows/native-ime-regression.yml (see docs/native-ime-regression.md) against the revision under test, with OS-level input on Ubuntu/X11 Firefox + Fcitx5 and Windows Firefox + Microsoft Japanese IME
- Rendered item text still wraps at its available width, other text controls keep soft wrapping, the caret is followed during composition, and the document scroll width does not grow
- The shared input proxy textarea.global-textarea has wrap="off" from its first render and keeps it through composition start, updates, confirmation, cancellation, later compositions and reloads
