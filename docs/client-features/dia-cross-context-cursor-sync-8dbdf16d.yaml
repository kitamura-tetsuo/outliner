title: Cross-client Diagram cursor presence
title-ja: クライアント間での Diagram カーソルプレゼンス共有
description: A Diagram's source cursor presence is addressed by Diagram identity rather than page or occurrence, so two independent browser clients editing or viewing the same transcluded Diagram see each other's caret and live edits regardless of which page or occurrence each client is on.
