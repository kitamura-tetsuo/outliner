title: Search & Replace Page Title Guard
title-ja: 検索・置換のページタイトル保護
description: Search & Replace never rewrites page titles unless "Include page titles" is checked. When titles are in scope, the rename is confirmed with the affected page names first, and the open route follows the rename instead of 404-ing.
