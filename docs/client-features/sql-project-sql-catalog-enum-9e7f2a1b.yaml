acceptance:
- A broken catalog draft leaves the other tables working; dependents report the missing type until the draft is fixed.
- A table schema referencing a catalog ENUM validates and applies; its rows store declared labels and reject unknown labels.
- Applying a valid type reports its labels; a type name taken by a table or another entry is rejected.
- The /demo and /demo-ja projects seed the feedback_sentiment type and the Feedback grid, and the SQL Catalog page renders them.
- The Types list creates entries whose source is one CREATE TYPE AS ENUM statement; multi-statement, qualified, non-ENUM, and empty sources are rejected with an explanation.
