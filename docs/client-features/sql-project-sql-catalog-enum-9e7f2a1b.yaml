id: SQL-9e7f2a1b
title: Project SQL catalog with executable ENUM types
title-ja: 実行可能な ENUM 型を持つプロジェクト SQL カタログ
description: 'Projects own a SQL catalog of shared ENUM types, authored through the existing shared Monaco SQL editor (SqlEditor.svelte) on the project''s Types management pages (/:project/-/types and /:project/-/types/:catalogId).

  Each catalog entry owns exactly one declarative SQL source: a single unqualified CREATE TYPE ... AS ENUM (...) statement. TYPE definitions belong to the Project while Table schemas/records and Grid/Calendar queries remain separate -- a table schema never declares a type inline and a query never creates one. Typing only moves a local draft; "Apply type" is the only commit: the draft is validated in a throwaway PGlite schema (labels read back from pg_enum, so the accepted grammar is what Postgres accepts) and, when valid, written to the project doc under its own undo scope on the shared project history.

  The table engine materializes the catalog into the project''s shared Postgres schema before building any table, so a table schema may reference a catalog type by plain name; schema validation runs against the same catalog, and a catalog change rebuilds affected table relations. A table name colliding with a catalog type name (or vice versa) is rejected, and one broken catalog draft never takes down the other tables -- dependents keep failing with the engine''s own "type does not exist" error until the draft is fixed.

  The public demo seeds an executable example: the feedback_sentiment ENUM in the demo''s own catalog and the Feedback table whose sentiment column uses it, demonstrated on the SQL Catalog demo page in /demo and /demo-ja.

  '
