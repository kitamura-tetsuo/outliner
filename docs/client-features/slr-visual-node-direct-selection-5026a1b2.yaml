acceptance:
- A block keeps every pointer gesture on its own content, including cell text drags and buttons
- A collaborator's direct block selection renders with the same endpoint semantics
- A directly selected Layout renders one container rectangle with no child overlays
- A drag from Text onto a block, and from a block onto Text, takes the block whole
- A drag from one block to another takes both blocks
- A forward drag and its reverse resolve to identical selected content
- A nested block's outline surface selects its Layout, the row the outline holds
- A visual node can be the direct start or end target of an outline selection
- Delete and Cut remove a directly selected block through ordinary node deletion
- No caret is ever placed inside a visual node, by pointer or by keyboard
- Plain-text copy of a textless visual-only selection carries no invented caption
- Pressing a block's outline surface selects it atomically as before(node) -> after(node)
- Shift+Up/Down crosses a block one edge per press, including and excluding it whole
- Shift-click extends an existing selection onto a block through its outline surface
- Structured copy and cut of a directly selected block preserve its binding
