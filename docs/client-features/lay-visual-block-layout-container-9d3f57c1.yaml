acceptance:
- A Layout visual container can be created in an outliner page (/Layout command, or the
  item context menu)
- The Layout renders a fixed 12-column equal-track CSS Grid
- Child width is controlled solely by an integer columnSpan of 1..12, clamped when read
- A span-4 child followed by a span-8 child shares one row, as does 6 + 6
- Auto-placement wraps to the next row once the cumulative span exceeds 12
- Tree order is the only persisted ordering, and is the rendered and accessible order
- Changing a span does not reorder the children
- No x/y, row, column-start, per-track fraction, row-span or pixel-width state is persisted
- Grid and Calendar are accepted as Layout children; ordinary text items and nested
  Layouts are rejected, leaving the tree unchanged
- A narrow Layout stacks one block per row in tree order without mutating stored spans,
  and returns to them when the width comes back
- Spans can be resized by dragging a whole-column handle and by keyboard (arrow keys,
  Home/End, and −/+ buttons)
- Visual children can be moved into, within, and out of a Layout through tree operations
- Removing the last child leaves an empty Layout that stays as an insertion/drop target
- Deleting the Layout follows normal subtree deletion, while Unwrap keeps the blocks, in
  order, with their component bindings intact
- Copy/duplicate preserves the children's order, spans and component-copy semantics
- Span changes made by a collaborator update the rendered layout reactively
- Grid and Calendar rendering outside a Layout is unaffected
