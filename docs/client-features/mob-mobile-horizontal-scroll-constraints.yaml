id: MOB-0004
title: Mobile Horizontal Scroll Constraints
title-ja: モバイルの水平スクロール制約
category: mobile
status: implemented
components:
- client/src/app.css
- client/src/components/yjstable/TableGrid.svelte
- client/src/components/calendar/CalendarTimeGrid.svelte
- client/src/components/calendar/CalendarGanttChart.svelte
tests:
- client/e2e/basic/mobile/mobile-horizontal-scroll.spec.ts
- client/e2e/basic/mobile/mobile-toolbar-scroll.spec.ts
