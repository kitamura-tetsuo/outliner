id: ITM-0003
title: Delete empty items with Delete key
description: Pressing Delete on an empty outliner item removes only its wrapper and promotes existing children in place.
category: item-management
status: implemented
acceptance:
- After deletion, the cursor moves to the beginning of the next item
- Pressing Delete on an empty item deletes that item
- Existing descendant IDs, nesting, and sibling order are preserved
tests:
- client/e2e/core/itm-delete-empty-item-9f4d79c4.spec.ts
- client/src/tests/integration/cursor/itm-boundary-descendant-preservation-5794.integration.spec.ts
