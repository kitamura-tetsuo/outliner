id: NAV-0002
title: Link function to project page
description: Every page view offers a way back to its project. Since HDR-6a4c2f1e the link lives in the global toolbar rather than in a breadcrumb above the editor - the toolbar names the open project and links to its page list - while the project page keeps its own "Home / project" breadcrumb.
category: navigation
status: implemented
acceptance:
- A page view offers a link back to its project through the global toolbar
- A page view renders no breadcrumb navigation
- Clicking the home link on the project page navigates to the home page
- Clicking the toolbar project name navigates to the project page
- The project page displays a link to home in breadcrumb navigation
- The toolbar project name matches the open project
tests:
