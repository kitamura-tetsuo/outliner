id: FTR-8ac92ce2
title: Project Object Manager
title-ja: プロジェクトオブジェクトマネージャー
description: 'A project-level screen (`/<project>/objects`, linked from the sidebar) that lists every Grid, Calendar, Table and Schedule in a project for browsing, renaming, and deleting. For Grid and Calendar it also lists the outline Pages where each object is directly rendered — never indirect dependencies, so a Table does not claim the Pages of Grids that reference it and a Schedule does not claim the Pages of Tables/Grids it reads or writes. Each Page/location entry is clickable and, via `navigateToOutlineItem`, navigates to the owning Page, expands collapsed ancestors, scrolls the exact placement Item into view and focuses it, addressed by the outline tree key so multiple placements (including several on the same Page) stay individually navigable. Clicking an object''s name enters an inline rename: the input auto-focuses, blur or Enter commits, Escape restores the previous name, and an empty name is rejected with a visible error rather than silently discarded. A standing hint and a panel that appears once any objects are selected expose the existing literal bulk Find/Replace with a before/after preview, so it is discoverable without a hidden menu. Delete removes the project-level object; for Grid and Calendar it also clears every outline item''s binding to it in the same transaction, leaving a plain empty Text node rather than an empty visual-node shell, and this is undoable as a single Ctrl+Z via a new generic "manual undo entry" primitive in the global undo router (services/undo/undoRouter.svelte.ts) that replaces whatever a transaction''s own Y.UndoManager scopes auto-captured with one entry whose undo/redo closures fully describe the operation — needed because the Grid/Calendar registries and the outline tree are separate Y.UndoManager scopes, so a plain shared transaction would otherwise split one user action across two router stack entries. Table and Schedule Delete reuse their own existing deletion semantics (`removeTableWithPolicy`, `deleteScheduleRuleWithUndo`) rather than a second, inconsistent path; the Table confirmation surfaces the same dependency preview (`getTableDependencies`) used elsewhere. Mutating controls (rename, bulk replace, delete) are disabled for read-only viewers, mirroring the write-access rule already used by the Schedules list — demo projects stay writable for everyone.'
category: client
status: implemented
acceptance:
- A Grid or Calendar delete and its placement removal undo as a single logical operation.
- Bulk literal Find/Replace is reachable without a hidden menu and shows a before/after preview before applying.
- Clicking a placement navigates to the Page, scrolls the exact placement Item into view and focuses it.
- Clicking an object's name starts inline rename; blur and Enter commit, Escape cancels and restores the previous name, and an empty name shows an error instead of being silently discarded.
- Delete removes the project-level object; Grid/Calendar delete also clears every outline placement without leaving an empty visual-node shell; Table and Schedule delete reuse their existing deletion semantics.
- Grid and Calendar rows show their direct Page placements; Table and Schedule rows never show placements inherited through a dependency.
- Multiple placements, including several on the same Page, are each individually listed and navigable.
- Object Manager lists Calendar in addition to Grid/Table/Schedule, and type filtering/search covers all four kinds.
- Rename, bulk replace and delete are disabled for read-only viewers; demo projects stay writable.
