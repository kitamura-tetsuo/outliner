id: GRD-a5186f0d
title: Spreadsheet Grid interaction and unified Find/Replace
title-ja: スプレッドシート形式の Grid 操作と統合検索・置換
description: Operate Grid query results with a logical, identity-based selection model across keyboard, mouse, and touch, then use the same selection for safe bulk commands, rectangular clipboard operations, and the page Find/Replace session.
category: tables
status: implemented
acceptance:
- All-result Delete clears writable cells but never implicitly deletes every result row, while row deletion honors the Grid confirmation setting
- Cell, range, row, column, and all-result selections use stable row and column identities rather than DOM focus or mounted cell enumeration
- Clear, row deletion, bulk edit, and rectangular paste use shared commands that validate writable targets before mutation; ID-addressed Yjs writes are grouped into one undoable action, while relation-backed writes keep their existing per-source undo behavior
- Mouse, keyboard, and touch interactions feed the same selection model, including spreadsheet navigation, edit mode, additive selection, and range extension
- Page Find traverses visible Grid cells in outline and row-major order alongside text items, with Page and Grid-selection scopes in one UI
- Query refresh removes filtered identities while sorting preserves selected rows, and computed or read-only cells remain selectable and searchable
- Replace changes only writable source cells, reports invalid or read-only targets, and deduplicates underlying cells when the same Grid has multiple placements
