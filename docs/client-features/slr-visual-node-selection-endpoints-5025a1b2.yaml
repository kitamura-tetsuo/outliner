id: SLR-5025a1b2
title: Selection endpoints can be visual-node boundaries
title-ja: 選択範囲の端点としてのビジュアルノード境界
description: 'An outline selection endpoint is no longer universally a character offset inside a Text node. An endpoint is either a text position - an item plus a character offset, exactly as before - or a node boundary: the position immediately before or after an atomic visual node (Grid, Calendar, Layout). A block therefore takes part in a selection as itself rather than through a fabricated offset or hidden placeholder text, and a range can start at a block, end at a block, or contain no text endpoint at all. Ordering is centralized in one comparator over outline order plus position within an item, where `before(node)` precedes every position the item can hold and `after(node)` follows every one, so the document positions around a Grid order deterministically as: end of the preceding text, before the Grid, after the Grid, start of the following text. Selections normalize to document order while keeping their anchor/focus direction aside, so a reverse selection resolves to exactly the content its forward twin does. One traversal resolves the endpoints into the selected fragments - a partial interval for an endpoint Text node, whole intervals for the Text nodes in between, and whole atomic fragments for the visual nodes the endpoints do not exclude - and the overlay, plain-text extraction and the structured clipboard all read that one answer, which comes from the outline model rather than from any rendered geometry. Plain text carries only what the outline holds, so a textless block contributes no characters and no phantom label or blank line, while the structured clipboard keeps carrying the blocks themselves. Remote presence publishes the endpoints so a collaborator''s mixed selection renders with the same semantics as a local one; a stale or malformed payload, including one from a peer that predates the model, is validated and dropped rather than rendered from a guessed position, and no persistent project data is migrated for this ephemeral state.'
category: selection-range
status: implemented
