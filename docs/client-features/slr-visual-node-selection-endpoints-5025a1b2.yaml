acceptance:
- A range from before a Grid to after it selects exactly that Grid and nothing else
- A range of visual nodes only, with no text endpoint at all, resolves to those nodes
- A selection ending before a Grid stops at it, and one ending after it includes it
- A selection starting after a Grid leaves it out, and one starting before it takes it
- Forward and reverse endpoint order resolve to identical selected content
- Node boundaries around adjacent visual nodes order deterministically
- Plain-text extraction skips textless visual nodes without inventing a label or a blank line
- Selection normalization and traversal come from the outline model, not from rendered geometry
- Selection rendering consumes the generalized endpoints without fabricating text offsets
- Stale or malformed remote selection payloads are dropped instead of rendered
- Text-to-text selections keep their existing behavior, geometry and clipboard output
- The structured clipboard still carries selected visual nodes whole
