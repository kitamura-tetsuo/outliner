id: FTR-5350c0de
title: Create a Grid on a Page through MCP
title-ja: MCPによるページ上のグリッド作成
status: implemented
description: The create_grid mutation validates a top-level Page, exact SELECT and any explicit INSERT preference, then atomically creates a project-owned Grid and appends its placement. It returns both identifiers and the saved query revision for immediate production reads. Dry runs validate without mutating or consuming an operation ID. Authorized concurrent and completed retries reuse the same creation through the existing replay cache. Current project authorization is checked before replay lookup, before publication and before both result and error disclosure after cleanup. Query-update replay checks admission outside the cache and retains accepted updates through release failures. Native binding visibility excludes shadowed same-named providers from browser source authority. Successful unresolved reads report unknown dependencies, and public diagnostics omit internal schema revisions. Structured errors and privacy-bounded audits cover every attempt, and successful apply/replay audit entries identify the created Grid.
