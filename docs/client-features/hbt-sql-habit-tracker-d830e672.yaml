id: FTR-d830e672
title: SQL-backed Habit Tracker
title-ja: SQLベースの習慣管理
description: 'Habit tracking embedded in an outliner item (component type "Habits"), built on the item-embedded SQL table feature. A single collaborative Yjs table stores both habit definitions (kind=habit: name plus repeat interval in days) and daily completion logs (kind=log: habit_id plus date), so the whole tracker is queryable with a SQL self-join and remains editable through the generic SQL table grid. The component shows a 7-day completion grid per habit with per-day toggle buttons, aggregates totals / done-today / last-completed via SQL (sql.js / SQLite), and computes the current streak using the habit''s own interval (a habit repeated every N days keeps its streak while consecutive logs are at most N days apart). Every log records its registration timestamp. Deleting a habit removes its definition together with all of its logs, and an item that already holds a table with a different schema requires explicit confirmation before conversion.

  '
category: client
status: implemented
tests:
- client/src/services/taskHabitService.test.ts
- client/src/components/HabitTracker.test.ts
