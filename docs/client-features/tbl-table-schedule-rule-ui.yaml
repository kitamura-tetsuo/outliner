id: TBL-3950a1b2
name: tbl-table-schedule-rule-ui
title: Table Schedule Rule UI Feature
status: implemented
category: client
description: Implements the client-side UI for viewing, creating, editing, and deleting a project's schedule rules using Yjs. Schedules are project-level entities and reference tables; no table owns them.
dependencies:
- '#3950'
testInstructions: '1. Open a project and navigate to /schedules/<project>.

  2. Verify the schedule rule list appears (initially empty or showing existing rules).

  3. Verify no table view offers a Schedule panel of its own.

  4. Click "+ New Rule" and verify the rule editor page opens at /schedules/<project>/<ruleId>.

  5. Fill out the rule form with valid schedule and SQL (e.g. `INSERT INTO...`).

  6. Save the rule and verify it appears in the list.

  7. Click "Run now" and verify that the rule is executed and updates the `Last run` status to OK or shows an inline error.

  8. Verify the rule can be edited and deleted.

  '
title-ja: Table Schedule Rule UI Feature
tests:
- client/e2e/core/sch-schedule-rule-run-now-3a4b5c6d.spec.ts
- client/e2e/core/tbl-table-schedule-rule-ui.spec.ts
- client/e2e/schedule/sch-schedule-rule-run-now-on-edit-page-9a8b7c6d.spec.ts
- client/e2e/schedule/sch-schedule-table-references-5d1c8a37.spec.ts
- client/src/components/schedule/ScheduleRuleList.test.ts
