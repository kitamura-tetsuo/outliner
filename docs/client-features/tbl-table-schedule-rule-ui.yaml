id: TBL-3950a1b2
name: tbl-table-schedule-rule-ui
title: Table Schedule Rule UI Feature
status: implemented
category: client
description: Implements the client-side UI for viewing, creating, editing, and deleting schedule rules for tables using Yjs.
dependencies:
- '#3950'
testInstructions: '1. Open a project and navigate to a page containing a Yjs table block.

  2. Click the "Schedule" toggle in the table views toolbar.

  3. Verify the schedule panel appears and shows "Schedule Rules" list (initially empty or showing existing rules).

  4. Click "+ New Rule" and verify the rule editor appears.

  5. Fill out the rule form with valid schedule and SQL (e.g. `INSERT INTO...`).

  6. Save the rule and verify it appears in the list.

  7. Click "Run now" and verify that the rule is executed and updates the `Last run` status to OK or shows an inline error.

  8. Verify the rule can be edited and deleted.

  '
title-ja: Table Schedule Rule UI Feature
tests:
- client/e2e/core/sch-schedule-rule-run-now-3a4b5c6d.spec.ts
- client/e2e/core/tbl-table-schedule-rule-ui.spec.ts
- client/e2e/schedule/sch-table-schedule-indicator-8f579b32.spec.ts
- client/src/components/schedule/ScheduleRuleList.test.ts
