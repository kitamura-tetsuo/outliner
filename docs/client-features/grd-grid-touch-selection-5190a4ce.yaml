id: GRD-5190a4ce
title: Touch and mobile Grid selection
title-ja: タッチ・モバイル向け Grid 選択
description: Use spreadsheet-style Grid cell, range, row, and column selection on touch devices without requiring keyboard modifiers or hover.
category: tables
status: implemented
acceptance:
- A floating, keyboard-accessible toolbar exposes additive selection, editing, and an extensible home for shared selection commands
- A tap activates a cell, a double tap enters its native editor, and a long press enters range-selection mode
- Large touch handles resize the same logical range used by mouse and keyboard selection
- Moving beyond touch slop leaves gesture ownership with native horizontal or vertical scrolling
- Opening a native cell editor preserves the logical active cell while the virtual keyboard changes the visual viewport
- Row and column headers remain directly tappable and additive mode provides understandable multi-selection without modifier keys
tests:
- client/src/components/yjstable/TableGrid.touch.test.ts
