id: HDR-6a4c2f1e
title: Project Name in the Global Header
title-ja: グローバルヘッダーへのプロジェクト名表示
description: The global toolbar names the project that is open and links to its page list, so a page view no longer repeats the identity above the editor. Page views (normal and demo) render no breadcrumb and no non-editable "{project} / {page}" heading; the editable page title in the editor is the single primary page-title display, and the page actions (Search, Schedule, Graph View, demo controls) stay in a compact action row. The label is read from the loaded project's Yjs title, so it follows a rename and a project switch and stays blank while only the provisional startup project exists.
category: navigation
status: implemented
components:
- client/src/components/Toolbar.svelte
- client/src/routes/[demoProject=demoProject]/[page]/+page.svelte
- client/src/routes/[project]/[page]/+page.svelte
tests:
- client/e2e/basic/mobile/toolbar-overlap.spec.ts
- client/e2e/core/hdr-project-name-global-header-6a4c2f1e.spec.ts
- client/e2e/core/hdr-project-name-global-header-demo-6a4c2f1e.spec.ts
- client/src/components/Toolbar.test.ts
- client/src/routes/[demoProject=demoProject]/[page]/page.svelte.test.ts
acceptance:
- A demo page view shows no "Home / Demo Project / page" breadcrumb
- A normal page view shows no "Home / project / page" breadcrumb
- No project label is shown while only the provisional startup project exists, so a route naming no project shows none
- On a narrow viewport the project label overlaps neither the sidebar toggle nor the page content
- Search, Graph View and the public-demo state message stay available on demo page views
- Search, Schedule and Graph View stay available on normal page views
- The editable page title in the editor remains visible and editable
- The global toolbar shows the current project's title once the project is loaded
- The non-editable "{project} / {page}" heading above the editor is gone from both page views
- The toolbar project name follows a rename of the open project and a switch to another project
- The toolbar project name links to the project's page list
