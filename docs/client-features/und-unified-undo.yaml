id: UND-0001
name: und-unified-undo
title: Unified Undo Stack Across Scopes
status: implemented
category: client
description: Consolidates the undo/redo behavior into a single global stack that delegates to the owning scope (outline vs. table), ensuring strict reverse chronological order across all edits in the project.
dependencies: []
testInstructions: |
  1. Open a project and type in an outline item.
  2. Create a database table and type into a data cell.
  3. Make another edit in the outline.
  4. Press Ctrl+Z repeatedly and observe that the edits revert in exactly the reverse order they were made, correctly crossing back and forth between the table and outline.
title-ja: スコープをまたぐ統合Undoスタック
