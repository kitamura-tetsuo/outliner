id: DUP-5090c0de
title: Dependency-aware Grid and Table duplication
title-ja: 依存関係を考慮した Grid と Table の複製
description: Duplicate Grid and Table object graphs within or across projects, with recursive scopes, reference rewriting, previews, and optional Table rows.
category: tables
status: implemented
acceptance:
- Allocate collision-safe object and SQL names and roll back failed graphs
- Collect referenced, referencing, or all connected Grid and Table objects recursively
- Copy Table definitions with an explicit option to include rows
- Preserve omitted references for same-project copies
- Rewrite copied internal references and clear omitted cross-project references
tests:
- client/src/services/yjstable/objectDuplication.test.ts
