id: FTR-5514c0de
title: Table-owned schema editing
title-ja: Table ページ専用のスキーマ編集
description: Embedded, Page, Layout and standalone Grids render their own Project SELECT and Grid-owned name and presentation through one primary-independent rich runtime. Actual SQL dependencies are a collection of links to Table-owned schema and raw-data pages, with explicit empty or unavailable states. Constants and outline_items require no user Table. Source-specific metadata describes typed cells and validation; guarded execution evidence independently authorizes physical-source writes. Grid controls never expose CREATE TABLE editing.
category: client
status: implemented
components:
- client/src/components/management/GridDetailView.svelte
- client/src/components/yjstable/TableEntityView.svelte
- client/src/components/yjstable/YjsTableBlock.svelte
- client/src/components/yjstable/YjsTableView.svelte
acceptance:
- A Grid displays its own name independently of the SQL suppliers
- Actual SQL dependencies have keyboard-accessible Table links; multiple, empty and unavailable dependency states are explicit
- Changing a Table query to a constant clears the previous Table claim
- Embedded and standalone Grid surfaces do not expose a CREATE TABLE editor
- Embedded and standalone Grids retain typed display, settings, charts, logical selection and copy without a mandatory Table
- Grid cell, bulk, paste, search, delete and Add row effects use captured current execution evidence and refuse stale intent
- Live supplier changes preserve Grid and Table Undo history; peer refresh permits separately initiated current operations
- Proven physical metadata supplies per-row UNION choices, nullability and input validation without granting write authority
- Replacing or removing a Grid ends the old occurrence authority and updates standalone identity
- Standalone private Grid data, pending actions and retained Grid/Table Undo and Redo are gated after logout or access revocation
- Table pages retain schema editing and editable raw data without requiring a Grid
- Table reference lists react to current registered SQL names and Grid SQL changes
