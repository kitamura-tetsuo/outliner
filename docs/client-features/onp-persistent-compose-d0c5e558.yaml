id: ONP-d0c5e558
title: Persistent localhost Docker Compose deployment
title-ja: 永続化された localhost Docker Compose デプロイ
description: The production on-premises client and server run from one loopback-only Docker Compose service, retaining the complete local project and Yjs data directory across recreation and stopped backup/restore.
category: deployment
status: implemented
acceptance:
- Operator documentation covers startup, health, restart, password replacement, backup, restore, and initial feature boundaries
- Project metadata and project/Table documents survive container recreation and complete-directory restore
- Required password and persistent directory configuration fail closed
- The production client, APIs, and WebSockets share one configurable loopback origin
tests:
- client/e2e/compose-onprem/onp-compose-recovery-d0c5e558.spec.ts
- client/e2e/onprem/onp-local-workspace-5586c10d.spec.ts
- client/e2e/onprem/onp-table-grid-sync-5586c10d.spec.ts
- server/tests/onprem-production-server.test.ts
