acceptance:
- A Firebase identity whose sign_in_provider is not google.com (e.g. email/password) is rejected with 403 at /oauth/authorize/callback even when it presents a valid Firebase ID token
- A redirect_uri or client_id that does not match the one used to obtain the code is rejected with invalid_grant
- An invalid, expired, or already-redeemed authorization code is rejected with invalid_grant at /oauth/token
- Completing Google sign-in and exchanging the resulting authorization code with the correct PKCE code_verifier returns an access_token whose decoded subject equals the authenticated Firebase uid, plus a refresh_token
- GET /.well-known/oauth-authorization-server and /.well-known/openid-configuration advertise the authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint, S256-only PKCE, and the outliner.read scope
- POST /oauth/revoke revokes a refresh token so it can no longer be exchanged, and always responds 200 regardless of whether the token existed
- Registering a client (POST /oauth/register) with a non-HTTPS, non-loopback redirect URI is rejected
- The /oauth/authorize page renders only a Google sign-in button; it never renders an email/password form
- The /oauth/authorize page uses a nonce-based, strict-dynamic CSP that permits the Firebase SDK and Google API loader without allowing unsafe inline scripts or unrelated origins
- The OAuth authorize page uses the client's VITE_FIREBASE_* Web App configuration, production startup fails when it is absent, and Firebase Auth Emulator environments use explicit emulator-only identifiers
- The refresh_token grant issues a new access/refresh token pair and revokes (rotates out) the previously used refresh token, so replaying it fails
