id: OAU-3dfadc9b
title: OAuth/OIDC bridge for ChatGPT/MCP (Google-backed Firebase identity)
title-ja: ChatGPT/MCP向けOAuth/OIDCブリッジ（GoogleベースのFirebase認証）
description: 'The on-premises Outliner server exposes a standards-compliant OAuth 2.0 authorization-code + PKCE bridge (GET /oauth/authorize, POST /oauth/authorize/callback, POST /oauth/token, POST /oauth/revoke, POST /oauth/register, and RFC 8414/OIDC discovery metadata at /.well-known/oauth-authorization-server and /.well-known/openid-configuration) so ChatGPT and other MCP clients can connect using a user''s existing Google-backed Firebase Auth identity.

  The /oauth/authorize page only offers "Sign in with Google" (via Firebase Auth''s GoogleAuthProvider); it never offers email/password sign-in. The authorization response uses Cross-Origin-Opener-Policy: same-origin-allow-popups so Firebase can complete the cross-origin Google popup while all other routes retain Helmet''s stricter default. The server independently verifies the resulting Firebase ID token (verifyIdTokenCached) and rejects any identity whose firebase.sign_in_provider is not "google.com", so email/password can never be used to obtain MCP credentials even if a token were forged client-side.

  Issued access tokens are short-lived Outliner-minted JWTs (HS256, subject = Firebase uid, scope = outliner.read) and are never raw Firebase ID tokens or Firebase service-account credentials. Refresh tokens are opaque, single-use-then-rotated, stored hashed in Firestore (oauthRefreshTokens) and revocable via /oauth/revoke. Authorization codes are single-use and expire within seconds. Dynamically registered OAuth clients (RFC 7591) are stored in Firestore (oauthClients); redirect URIs must be HTTPS or loopback HTTP and are validated against the exact set registered for that client_id.'
