id: FTR-53f59906
title: Yjs + PGlite database tables
title-ja: Yjs + PGlite データベーステーブル
description: 'A single consolidated table feature that replaces the former Table (/table), SQL Table (/sql, SQL Block), SQL Task Manager and SQL Habit Tracker. Each table is one Y.Doc subdoc registered in the project doc (tableId -> subdoc reference + display name). Tables can be reused across multiple blocks by selecting them from an existing tables list during creation. Each table holds three structures: a Schema Definition (Y.Text with a single CREATE TABLE statement, applied via an explicit Apply button and validated against a throwaway PGlite schema with a warning dialog for destructive changes), a UI Definition (Y.Map edited through a structured form: query string plus nested per-column cell component settings), and Data Storage (Y.Map of records, each a nested Y.Map keyed by column name for field-level CRDT merges). An in-memory PGlite (Postgres WASM) engine is loaded lazily and acts as the computation engine: a one-way sync adapter observes Data Storage, casts values strictly to the schema types, applies them with parameterized statements (per-record errors are surfaced in the UI without stopping other records) and re-runs the UI query debounced. The grid maps cells to dynamic components (text/number/checkbox/select/date; select options come from CHECK (col IN (...)) constraints), enforces read-only rules (aggregate/grouped queries, calculated columns, and results carrying no usable row identity) and writes edits back to Yjs only, never to PGlite. A relation is not necessarily a table: the project also exposes the system-defined, reserved relation "outline_items", which sparsely projects outline items carrying a structured "due" date (with page_id, parent_id, text, due, done) and is maintained incrementally by diffed upserts from observeDeep. A result is editable when it carries either a bare id column from one relation or a source_kind + source_id pair that survives a projection across several relations (a UNION of items with generated rows, say); the write is then dispatched by provenance to the relation named by source_kind — a table row to the table Data Storage Y.Map, an item row to that item node value field. The items relation declares asymmetric capabilities: UPDATE writes the mapped field, INSERT requires an explicitly chosen destination (there is no implicit inbox), and DELETE requires an explicit choice between deleting the item and only clearing its date, so deletion is never silently destructive. Views (schema editor, UI definition editor, grid, chart) can be toggled in parallel, each table has its own undo scope behind a single global undo/redo stack that delegates to the scope an operation was applied to, and Tasks/Habits presets recreate the former task manager and habit tracker as CREATE TABLE + UI Definition templates. The feature is embedded in outliner items via the "Database" component type (componentType "yjstable").

  '
