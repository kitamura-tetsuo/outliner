id: FTR-9c8a7b6c
title: Global SQL Database Integration
title-ja: グローバルSQLデータベース統合
description: "Introduce a global, project-wide SQL database feature built on SQLite (sql.js) and synchronized via Yjs.\n\n## 1. Core Architecture\n- **Database Engine**: Frontend-based SQLite (WASM).\n- **Data Storage & Sync**: Data is stored within the Yjs collaborative document (Approach A: shared `Y.Map`) and synced to the backend. Real-time synchronization is required.\n- **Table Identification**:\n  - Internal: Unique UUIDs (hidden from the user) to prevent absolute collisions.\n  - User-facing: Unique Alias names and Tags.\n  - Alias Duplication: **Strictly prohibited** across the project/workspace.\n\n## 2. Table Creation & Definition\n- **Definition Method**: Raw DDL (`CREATE TABLE ...`). Users write exact SQL to define the schema.\n- **Data Import/Export**: CSV Import and Export capabilities are included in the initial release.\n- **Independence**: Tables do not inherently belong to a single page; they are global entities within the workspace.\n\n## 3. Query Execution & Display (In-Page)\n- **Execution Trigger**: SQL queries automatically execute when the page containing them is opened.\n- **Safety**: In-page SQL blocks are strictly **Read-only (`SELECT` only)**, separated securely from DDL/DML definition modes.\n- **Performance**: Queries have a hard timeout to prevent locking the browser thread.\n- **Display**: \n  - Results can be rendered as charts or grids.\n  - Chart configurations (axes, types) are stored within the chart component state/metadata, not the SQL string.\n  - An \"SQL Icon\" is placed next to the chart. Clicking this icon transitions into the \"SQL Edit Mode\".\n\n## 4. User Interface & Navigation\n- **Global Management**: A dedicated \"Database\" section exists in the Left Sidebar.\n- **Table List UI**: Displays Table Name (Alias), Tags, Created Date, Updated Date, Row Count, and Data Size. Provides access to Definition UI and Data Edit UI.\n- **In-Page Aliases**:\n  - Users can place a \"Table Alias\" on a regular page.\n  - Visually, it appears as a simple \"Link Icon\".\n  - **Namespace feature**: When an alias is placed on a page, it can be accessed in queries using the `PAGE_TITLE/TABLE_NAME` syntax. This serves as a visual folder/namespace organization for users to easily group and oversee related items, though the base alias remains globally unique.\n"
category: client
status: planned
