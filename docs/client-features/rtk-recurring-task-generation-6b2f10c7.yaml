id: FTR-6b2f10c7
title: Recurring task generation with schedule rules
title-ja: スケジュールルールによる繰り返しタスク生成
description: 'Daily and weekly tasks generated by the recurring SQL execution of
  schedule rules, demonstrated on the demo project''s "Recurring Tasks" page. One
  table (the "Routines" table) holds both the recurring task definitions (kind =
  ''template'') and the dated occurrences generated for them (kind =
  ''occurrence''). Two schedule rules target the table: one runs every day at
  00:00 and one every Monday at 00:00 (UTC). Each run inserts one occurrence per
  task definition of its cadence, using current_setting(''job.occurrence'') as the
  time so catch-up runs produce the row of their scheduled occurrence rather than
  the execution time. A recurring task is identified by a task_key column rather
  than by its title, and the id of an occurrence is task_key + occurrence date, so
  re-running an occurrence is a no-op (ON CONFLICT DO NOTHING) and never resets a
  completed task. The table query shows only the newest occurrence of each
  task_key (correlated NOT EXISTS, which keeps the grid editable) while earlier
  occurrences remain in the table as history, and the boolean done column renders
  as a checkbox so completion can be entered directly in the grid.

  '
