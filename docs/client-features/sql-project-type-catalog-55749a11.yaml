id: SQL-55749a11
title: Authorized Project SQL type catalog on the SQL editor
title-ja: SQLエディター上の認可されたプロジェクトSQL型カタログ
description: Authorized users browse Project-owned SQL TYPE declarations on a dedicated management surface and create, inspect, edit and delete ENUM source through the existing SQL editor. Every read and mutation travels the authenticated catalog transport backed by the revision-bound catalog service; Table schemas, records and Grid SELECT queries stay in their own editors, and non-ENUM DDL is reported unsupported.
category: client
status: implemented
components:
- client/src/components/management/ManagementLanding.svelte
- client/src/components/management/TypeListView.svelte
- client/src/components/yjstable/SqlCatalogPanel.svelte
- client/src/lib/managementPaths.ts
- client/src/services/yjstable/sqlCatalogClient.ts
- server/src/server.ts
- server/src/sql-catalog-routes.ts
acceptance:
- Authorized users create, inspect, edit and delete one unqualified CREATE TYPE AS ENUM declaration per object through the existing SQL editor
- Catalog UI lists persisted declaration identities, kinds and resolved ENUM names from the authorized transport
- Every mutation travels the authenticated transport and is refused for missing or denied grants
- Only the ENUM kind is exposed as executable; other DDL is reported unsupported rather than presented as working
- TYPE source stays separate from Table schema/record editors and Grid SELECT editors
tests:
- client/src/components/yjstable/SqlCatalogPanel.test.ts
- client/src/lib/managementPaths.test.ts
- client/src/services/yjstable/sqlCatalogClient.test.ts
- server/tests/sql-catalog-routes.test.ts
