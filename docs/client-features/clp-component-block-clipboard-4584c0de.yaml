id: CLP-4584c0de
title: Copy and paste component blocks
title-ja: コンポーネントブロックのコピー＆ペースト
description: Copy, cut, and paste Grid and Calendar host items while preserving their component bindings.
category: clipboard
status: implemented
components:
- client/src/components/EditorOverlay.svelte
- client/src/components/OutlinerTree.svelte
- client/src/lib/KeyEventHandler.ts
- client/src/services/clipboard/itemClipboard.ts
acceptance:
- A Ctrl/Cmd+A page-wide selection copies its Grid and Calendar hosts, so pasting the page at the end repeats those blocks.
- A whole-item selection carries Grid and Calendar binding identifiers in the in-app clipboard format.
- Cutting and pasting moves host items without deleting their underlying table or calendar data.
- Partial item selections and external clipboard content retain the existing plain-text behavior.
- Pasting into another project safely falls back to plain text because component registries are project-local.
- Pasting within the same project creates a second view of the existing component rather than duplicating its data.
- Structured component metadata has a portable HTML clipboard representation when the private MIME type is unavailable.
