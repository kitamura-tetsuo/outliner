id: CLP-4584c0de
title: Copy and paste component blocks
title-ja: コンポーネントブロックのコピー＆ペースト
description: Copy, cut, and paste Grid and Calendar host items, sharing bindings within a project and cloning portable Grid structure across projects.
category: clipboard
status: implemented
components:
- client/src/components/EditorOverlay.svelte
- client/src/components/OutlinerTree.svelte
- client/src/components/yjstable/TableChartPanel.svelte
- client/src/components/yjstable/YjsTableView.svelte
- client/src/lib/KeyEventHandler.ts
- client/src/services/clipboard/crossProjectGridPaste.ts
- client/src/services/clipboard/gridClipboardExport.ts
- client/src/services/clipboard/itemClipboard.ts
- client/src/stores/tableClipboardRegistry.ts
acceptance:
- A Ctrl/Cmd+A page-wide selection copies its Grid and Calendar hosts, so pasting the page at the end repeats those blocks.
- A Grid copied while its Chart view is open also carries the chart as a PNG, in the HTML flavor and as an image/png flavor of its own; an unrendered chart falls back to the table flavors, never to the display name.
- A Grid that no view has rendered still copies as its display name, so a copy never blocks on a query.
- A calendar reading both reports which half rebound.
- A copied Grid pastes into a spreadsheet as its cells and into a document as a table, showing the view's column order, column labels and visible columns only.
- A copy-time selection does not survive navigation to another page or project, so a Ctrl/Cmd+A copy of a page pastes all of its lines and Grid blocks into the destination instead of being silently dropped.
- A cross-project Calendar paste reproduces query, view type, timezone, all role columns, grouping axes, lane order and the remaining view settings.
- A cross-project Grid clone copies and safely rewrites the display metadata, SQL schema/name, complete UI definition, and rows resolved from the live source at paste time; its Data Storage remains independent of the source project.
- A later, separate cross-project paste of the same clipboard binds its host to the clone the first paste made, rather than creating a second table or an unbound create panel; Paste Special's independent copy still creates another fresh clone.
- A mouse drag that stops inside the first or last item still copies any Grid or Calendar host it crosses; the partly selected edge items contribute only their selected text.
- 'A paste always lands: with no item of the current page active, it appends to the end of the page instead of being discarded together with the tables it had already created.'
- A paste reproduces the copied outline shape, taking the depth of each item from the in-app payload and, for plain text, from its leading whitespace.
- A read-only destination is untouched, and cancelling or navigating away during a Grid paste removes every table created by the operation.
- A same-project Calendar paste still retains its shared binding.
- A v1/v2 clipboard payload still pastes correctly.
- A whole-item selection carries Grid and Calendar binding identifiers in the in-app clipboard format.
- An unreachable source produces a structure-only Grid clone with a visible reason, while a reachable zero-row source is a successful populated clone.
- Cutting and pasting moves host items without deleting their underlying table or calendar data.
- Grid row data never appears in a clipboard MIME payload.
- Its `outline_items` entries show the destination project's items.
- Its table-backed entries carry their rows (via the closure).
- Partial selections without a component block, and external clipboard content, retain the existing plain-text behavior.
- Paste Special (Ctrl/Cmd+Shift+V) offers another view, independent copies with or without data, and values only; availability and defaults follow the source and destination projects.
- Paste Special keeps impossible choices visible and disabled with a reason, and reports the selected outcome.
- Pasting a Grid into another project creates one fresh destination table per copied source table, with a fresh table ID and destination-derived subdocument GUID; copied hosts that shared a source table share that one clone within the paste operation.
- Pasting a Grid within the same project creates another live view of the existing table, retaining its shared binding and Data Storage.
- Pasting a page whose Grids are populated creates one item per copied item, not one per rendered table row.
- Structured component metadata has a portable HTML clipboard representation when the private MIME type is unavailable.
- 'The Grid export never truncates silently: a result past the row cap, or a chart image past the size cap, carries a notice in the copied content.'
- The private in-app payload still names the Grid, so pasting back into Outliner behaves exactly as before.
