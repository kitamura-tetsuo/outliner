- client/src/components/yjstable/TableGrid.catalogEditAuthority.test.ts
- client/src/services/yjstable/catalogRuntimeEviction.test.ts
- client/src/services/yjstable/catalogRuntimeInputChanges.test.ts
- client/src/services/yjstable/catalogRuntimeReopen.test.ts
- server/tests/sql-catalog-service-repair.test.ts
