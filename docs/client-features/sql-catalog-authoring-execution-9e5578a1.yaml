title: SQL catalog authoring-to-execution evidence
title-ja: SQL カタログの作成から実行までの検証
description: A production-boundary regression authors an ENUM in the Project SQL Types UI, verifies effect-free validation and authenticated application, then creates and edits a dependent Table and observes declaration-order results through ordinary Grid and fresh-client routes with exact Yjs string values.
