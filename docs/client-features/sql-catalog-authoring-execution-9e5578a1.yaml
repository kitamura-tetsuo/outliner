acceptance:
- A dependent Table stores exact strings and an ordinary Grid orders them by ENUM declaration order
- Catalog source is entered, validated without effects, and applied through the real SQL Types UI and authenticated transport
- Cold routes reconstruct the catalog without first opening its editor
- Draft cancellation, remote conflicts, unconfirmed application, refused Undo, and both localized demos retain focused regression coverage
- MCP and Schedule production services execute typed data with the same ENUM semantics
