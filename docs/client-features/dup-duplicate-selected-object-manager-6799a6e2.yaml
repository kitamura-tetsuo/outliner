id: DUP-6799a6e2
title: Object Manager "Duplicate selected"
title-ja: オブジェクトマネージャーの「選択項目を複製」
description: 'Object Manager becomes the primary UI for duplicating multiple related project objects (issue #5153), replacing the per-object recursive scope chooser as the entry point: `Selection -> Rename / Delete / Duplicate`, with `Select related` (Dependencies/Dependents/All connected, `objectDependencyGraph.ts`) as the sole way to grow the set before duplicating. A `Duplicate selected (N)` bulk action, disabled with an empty selection, duplicates the exact current selection — including objects hidden by the active search/type filter, with the same warning-colored hidden-selection message and count bulk Rename/Delete already show — and never expands it through the dependency graph itself. The duplication engine (`services/yjstable/objectDuplication.ts`) gained `previewObjectSetDuplication`/`duplicateObjectSet`, an explicit-selection counterpart to the existing scope-based `previewObjectDuplication`/`duplicateObjects`: both now share one `materializeDuplicationPlan` core, so a reference from a selected object to another selected object is rewritten to the copy through the same `idMap`/`sqlNameMap`, while a reference to an object outside the selection follows the existing same-project-preserve / cross-project-clear-and-warn policy unchanged — the graph is read only to classify references, never to grow the copy set. The new `ObjectSetDuplicationDialog` shows only what still matters once the set is chosen: destination project, a Table-rows/data checkbox applying to every selected Table, an object-count-and-type-breakdown preview, the hidden-selection warning, and an omitted-reference warning phrased for same-project (kept) vs cross-project (cleared) duplication — never a second scope chooser. A destination-Page option remains available, exactly like the single-object dialog, only when the selection resolves to exactly one Grid duplicating within the same project. The whole operation is one undo-router step: `UndoRouter.captureManualAsync` (a new async counterpart to `captureManual`) purges whatever every registered `Y.UndoManager` auto-captured across the (possibly subdoc-syncing) materialization and replaces it with one manual entry; Undo rolls back every created object (and any destination-Page placement) at once, and Redo re-runs `materializeDuplicationPlan` with the exact same id map so every duplicated object keeps its identity across an undo/redo cycle. Individual Grid/Table/Schedule/Calendar pages keep a convenient `Duplicate` action, but it now opens Object Manager with that object preselected (`/<project>/-/objects?selected=<id>`) instead of the old dialog directly — Object Manager widens an incompatible type filter and clears a search query that would hide the preselected object, so it is always reachable. A cross-project Apply publishes the destination project''s Yjs client (`yjsStore.yjsClient`) and project (`store.project`) itself before navigating there client-side, since the `[project]` route layout only loads a project when no client is registered yet; the same fix applies to the pre-existing single-object `ObjectDuplicationDialog` for the same latent gap.'
category: client
status: implemented
acceptance:
- A cross-project Duplicate selected copies every selected object into the destination once, rewrites selected-to-selected references, and lands on the destination project's Object Manager with the copies preselected — the app correctly displays the destination project's data immediately, not the source's.
- A reference from a selected object to another selected object is rewritten to the copy; a reference to an unselected object is preserved same-project and cleared-with-a-warning cross-project, for Grid, Schedule and Calendar alike.
- A shared dependency reachable from multiple selected roots, or a cycle, is copied exactly once.
- An individual Grid/Table/Schedule/Calendar page's Duplicate action opens Object Manager with that object preselected via `?selected=`, widening an incompatible type filter and clearing a search query that would otherwise hide it.
- Duplicate selected is disabled with no selection and duplicates the exact current selection, including objects hidden by the active filter, with the count and hidden-selection warning matching bulk Rename/Delete.
- 'Duplicate selected is one undo-router step: Undo removes every object (and any destination-Page placement) the operation created, and Redo recreates them with the same ids.'
- Duplicate selected never expands the selection through the dependency graph and never shows the old referenced/referencing/connected scope chooser.
- The Table rows/data option applies to every selected Table; the destination-Page option appears only for a single-Grid, same-project selection.
- The preview reflects the exact explicit selection (never a recomputed scope) with an object-count/type breakdown and destination project.
