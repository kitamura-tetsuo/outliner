id: ENV-8f3a61d4
title: Playwright image corrections are published to the PR source branch
description: 'When a same-repository pull request resolves a @playwright/test version that differs from the E2E container base image, CI publishes the Dockerfile correction to the pull request''s own source branch. A pull_request run checks out the synthetic merge commit in detached HEAD, so scripts/publish-playwright-sync.mjs takes the repository, PR number, source ref and source head SHA H from the event payload, reads the lockfile and Dockerfile from H itself, and builds commit C whose sole parent is H and whose only change is the Dockerfile version token, without touching the checkout. C is pushed with --force-with-lease=<ref>:H, a server-side compare-and-swap, so a branch that advanced, diverged or was deleted keeps its newer state and the run reports a non-success stale outcome instead of overwriting it. Publication is claimed only after the remote ref is observed at C. The step exposes outcome (published, aligned, ineligible, stale, failed), repository, pr_number, source_ref, source_sha, result_sha and a JSON result as step outputs and as the reusable workflow''s sync_result output. Invalid or ambiguous inputs, rejected pushes and stale targets fail with the branch, the required image and a next step. Fork PRs and push or manual runs never reach the publisher, and the independent version check runs on the checkout either way, so an unpublished correction cannot turn the job green.'
category: environment
status: implemented
components:
- .github/workflows/ci-playwright-version.yml
- .github/workflows/ci.yml
