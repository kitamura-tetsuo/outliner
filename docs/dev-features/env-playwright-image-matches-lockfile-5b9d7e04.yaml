id: ENV-5b9d7e04
title: Test container Playwright image matches the locked Playwright version
description: The E2E test container built from .github/container/Dockerfile is based on mcr.microsoft.com/playwright at exactly the version client/package-lock.json resolves for @playwright/test, because the image ships the browser bundle for that release only. When the two drift apart every E2E shard fails at browserType.launch with "Executable doesn't exist", so scripts/check-playwright-version.mjs enforces the match and runs as a dedicated CI job before the E2E shards start.
category: environment
status: implemented
components:
- .github/container/Dockerfile
- client/package-lock.json
- scripts/check-playwright-version.mjs
- .github/workflows/ci-playwright-version.yml
- .github/workflows/ci.yml
tests:
- scripts/tests/env-playwright-image-matches-lockfile-5b9d7e04.spec.ts
title-ja: Test container Playwright image matches the locked Playwright version
