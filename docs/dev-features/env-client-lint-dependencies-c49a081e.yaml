id: ENV-c49a081e
title: Prepare client lint dependencies before running tests
title-ja: テスト実行前にクライアントのlint依存関係を準備
description: scripts/test.sh verifies the local stylelint and eslint executables and stylelint-config-standard before formatting or running tests. If any are missing, it installs the client dependencies with --include=dev, including under NODE_ENV=production. Fresh trees use npm ci; existing trees use npm install to avoid deleting working dependencies before fetching. Installation failures stop the test script instead of skipping lint. Complete installations do not trigger another install. The preparation also runs for single-test invocations and when SKIP_DPRINT=1.
category: environment
status: implemented
components:
- scripts/test.sh
- scripts/ensure-client-lint-dependencies.sh
tests:
- scripts/tests/env-client-lint-dependencies-c49a081e.spec.ts
