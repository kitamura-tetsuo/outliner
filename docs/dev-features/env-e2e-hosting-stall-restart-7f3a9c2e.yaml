id: ENV-7f3a9c2e
title: E2E startup retries a selectively stalled hosting emulator
description: Hosting readiness belongs to firebase-emulators in the generic service recovery policy. If its checks stay continuously unready for 60 seconds, the shared startup gate restarts firebase-emulators at most once within the original 180-second deadline. This replaces the former Hosting-only 120-second restart and cannot trigger an additional legacy restart. Timeout diagnostics retain the head of logs/firebase-emulators.log.
category: environment
status: implemented
components:
- scripts/ci-e2e-start.sh
- scripts/common-functions.sh
tests:
