id: ENV-3e6b41c7
title: CI builds the server container images on every pull request
description: The CI entry workflow builds server/Dockerfile and server/Dockerfile.debug on pull requests without pushing, and runs the built server image to prove its natively compiled modules (better-sqlite3) load, so image breakage is caught before it reaches main instead of only in the main-only push-and-publish workflow.
