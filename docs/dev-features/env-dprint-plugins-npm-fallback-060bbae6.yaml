id: ENV-060bbae6
title: dprint plugins restored from npm when the plugin CDN is blocked
description: scripts/ensure-dprint-plugins.sh recovers the committed wasm plugins from three sources in order — git lfs pull, npm pack of each plugin's npm package, then plugins.dprint.dev — so formatting works in sandboxes that allow registry.npmjs.org but block the dprint plugin CDN. functions/dprint.json resolves its plugins from the same local dprint-plugins/ directory instead of remote URLs.
category: environment
status: implemented
components:
- dprint.json
- functions/dprint.json
- scripts/ensure-dprint-plugins.sh
tests:
- scripts/tests/env-dprint-plugins-npm-fallback-060bbae6.spec.ts
title-ja: プラグインCDNが遮断された環境でnpmからdprintプラグインを復元
