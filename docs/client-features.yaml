- id: FTR-9ce96e44
  title: Day / multi-day / week / month calendar views with drag and resize
  title-ja: ドラッグとリサイズに対応した日・複数日・週・月カレンダービュー
  description: 'The four time-grid calendar views share one layout and interaction model over a calendar''s query result (docs/crdt-sql-architecture.md §6). Day/multi-day/week views lay entries out on an hour grid, with a separate all-day band and due-only entries rendered as deadline markers rather than blocks; month view lays entries into day cells, placing a multi-day all-day entry once per day it covers. Entries that overlap in time on the same day split into side-by-side columns via a pure, DOM-independent layout function; a day with no overlapping entries keeps the full width. Dragging an entry writes its start column and resizing its bottom edge writes duration, both through the relation''s existing write path (relationRowWrite.ts) and gated by whether the calendar query''s SELECT list exposes that column as a bare, writable passthrough rather than a calculated expression (calendarColumnWritability.ts) — an entry whose start has no writable origin is not draggable and is rendered visibly non-interactive. The drop/resize/keyboard-move feedback is optimistic: the card moves immediately and a later query result reconciles it, keyed by source_kind/source_id so a reordering requery still matches the right card, and a rejected write reverts the card and shows the reason. Grid ranges (day/week/month) are computed in the calendar''s own IANA timezone (falling back to the viewer''s local zone), reusing the DST-safe wall-clock conversion built for calendar recurrence, so Prev/Today/Next navigation and day/week boundaries stay correct across a DST transition and agree between two viewers of a calendar with a fixed timezone. Week start defaults to the viewer''s locale and, once set, is a shared, undoable calendar setting; the grid also carries a configurable working-hours band it scrolls to on open. Entries are keyboard-operable: arrow keys move a focused entry through the same write path and writability rule as a drag. Pointer-based drags suppress text selection across the grid and page by opting out of the native mouse-down selection gesture and applying `user-select: none`. While a move or resize drag is in flight, a small chip near the pointer shows the destination the drop would write — `Thu, Aug 3 09:15 – 09:45` for a move, `09:00 – 10:30 (1h30m)` for a resize, and the target date alone for an all-day entry or a month-view drop — formatted in the calendar''s own timezone and using the same snapping the drag applies, so the label always agrees with what is committed on release. The chip takes no pointer events and never appears for a non-writable entry. Each time-grid column is labelled with a sticky header showing its weekday and date (e.g. "Mon 17"), computed in the calendar''s timezone, matching the toolbar''s date range label and pinning to the top of the viewport when scrolling.

    '
  category: client
