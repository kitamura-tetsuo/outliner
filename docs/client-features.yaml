- id: CNT-7b28a4f0
  title: Eventless ContainerSelector via ucVersion
  title-ja: イベントレスなContainerSelector（ucVersion依存）
  description: 'Completely eliminate CustomEvent dependency (firestore-user-container-changed) from ContainerSelector and prove that stable recalculation is possible only with firestoreStore.ucVersion and Svelte 5 $state/$derived. Maintains a design where immediate reflection is achieved by ucVersion++ in both setUserContainer replacement path and array push/pop via Proxy, while adding a fallback that polls for ucVersion changes in the test environment to backstop redraws. Confirmed in E2E that setUserContainer replacement via yjsService directly leads to option increase in real UI.

    '
  category: project
  status: removed
  components: []
  impact:
  - ContainerSelector depends only on firestoreStore.ucVersion and internal redraw backstop
  - Immediate UI reflection by ucVersion++ in both setUserContainer replacement and array push/pop
  - Removed CustomEvent firing from firestoreStore.setUserContainer and visualized differences with log output
  tradeoffs:
  - Additional state called ucVersion version counter needs to be managed continuously
  - Redraw polling dedicated to test environment does not run in production (no unnecessary cost but branches increase)
  notes:
  - containerStore.containers remains a getter. Name resolution is as before
  - Verified yjsStore updates -> option increase in short E2E equivalent to Production
  - Can track changes in ucVersion, accessible count, and default ID with INFO logs of firestoreStore.setUserContainer
  tests:
  - client/e2e/new/cnt-container-selector-setusercontainer-reflects-7b28a4f0.spec.ts
- id: CNT-9f3a7c21
  title: ContainerSelector Stable Recalculation (PoC)
  title-ja: ContainerSelectorの安定再計算（PoC）
  description: 'Reduce reliance on CustomEvent for ContainerSelector reactivity and validate that $state/$derived-only

    dependencies can drive stable DOM updates. Introduced a $state-based version counter (ucVersion) on

    firestoreStore that increments on setUserContainer and Proxy-driven array mutations. ContainerSelector

    now derives its options based on firestoreStore.ucVersion and containerStore.containers, while a

    test-only polling fallback keeps redraws in sync when initialization races occur.

    '
  category: project
  status: removed
  components: []
  impact:
  - Recalculation on the component side is triggered by dependency on firestoreStore.ucVersion
  - Immediate reflection by ucVersion++ in both setUserContainer replacement path and Proxy destructive changes
  - Initialization races are mitigated by running ucVersion polling in the test environment
  tradeoffs:
  - Since dependencies are concentrated on top-level $state, design debt of holding a version counter in the store increases
  - Polling is limited to the test environment, but the code path becomes complicated
  notes:
  - containerStore.containers remains a getter. Container name resolution is as before.
  - CustomEvents have been completely eliminated in the current phase. PoC results confirmed in Production-equivalent flow.
  - Future consideration of organizing ucVersion itself (migration to a more declarative reactivity path).
