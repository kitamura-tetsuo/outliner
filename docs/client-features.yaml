- id: FTR-e3a9f2b1
  title: Gantt view
  title-ja: ガントチャートビュー
  description: 'A Gantt view over the same calendar query as the day/week/month grids (docs/crdt-sql-architecture.md §6.7): one row per entry, a bar spanning start to derived end, across a horizontal axis whose granularity (day/week/month/quarter) is a per-calendar view setting that drives the injected visible range. Hierarchy is the outline hierarchy — outline_items already carries parent_id, so nesting and a parent''s rolled-up bar (spanning its whole subtree''s earliest start to latest end, recomputed whenever a descendant moves) come for free, with no separate Gantt hierarchy to define. A parent''s own start/duration are superseded by the roll-up once it has dated descendants, but its own due still renders as an independent marker alongside the rolled-up bar. An entry with no duration (a bare start, or a bare due) renders as a point/marker rather than a zero-width bar. Dragging a leaf bar writes its start and dragging its edge writes duration, through the exact same relation write path, writability rule and optimistic-placement model the time-grid views use; dragging a parent''s rolled-up bar instead shifts every start-bearing descendant by the same delta, preserving relative offsets, as a single undo entry — and is refused, reading as undraggable, when any one of those descendants is not itself writable. A drag in flight shows a chip near the pointer carrying the day-snapped destination: the new start date for a leaf bar, the new end date plus a length in days for a resize, and the shift plus resulting start (e.g. `+3 days → Fri, Aug 4`) for a roll-up subtree drag, formatted in the calendar''s own timezone. Pointer-based drags suppress text selection across the chart and page by opting out of the native mouse-down selection gesture and applying `user-select: none`. When a calendar''s grouping axis is active, hierarchy and roll-up are flattened (rows become flat lane sections) rather than showing a roll-up whose length would depend on which lane is currently visible. Collapse/expand state is per-viewer local UI state, never written to the project doc. No dependency-link (finish-to-start) data or UI is introduced.

    '
  category: client
  status: implemented
  tests:
  - client/e2e/new/cal-gantt-drag-tooltip-7f31c0ae.spec.ts
  - client/e2e/new/cal-gantt-view-e3a9f2b1.spec.ts
  - client/src/components/calendar/CalendarDragTooltip.test.ts
  - client/src/services/calendar/calendarDragLabel.test.ts
  - client/src/services/calendar/calendarEntries.test.ts
  - client/src/services/calendar/calendarGanttLayout.test.ts
  - client/src/services/calendar/calendarGanttWrite.test.ts
  - client/src/services/calendar/calendarGridRange.test.ts
  - e2e/new/cal-gantt-drag-move.spec.ts
