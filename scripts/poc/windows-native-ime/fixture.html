<!doctype html>
<meta charset="utf-8">
<title>Native IME PoC</title>
<style>body{font:24px sans-serif;padding:40px}textarea{font:32px sans-serif;width:800px;height:240px}</style>
<h1>Native IME PoC</h1>
<label for="editor">Native IME test input</label><br>
<textarea id="editor" aria-label="Native IME test input"></textarea>
<pre id="status"></pre>
<script>
const editor = document.querySelector('#editor');
const events = [];
const sessionId = crypto.randomUUID();
const action = 'standalone';
let sequence = 0;
let registered = false;
let composing = false;
let compositionId = 0;
function report(event) {
    if (event?.type === 'compositionstart') { composing = true; compositionId++; }
    if (event?.type === 'compositionend') composing = false;
    if (event) events.push({sessionId, action, compositionId, sequence: ++sequence, time: performance.now(), type: event.type,
        trusted: event.isTrusted, data: event.data, key: event.key, code: event.code,
        inputType: event.inputType, isComposing: event.isComposing, value: editor.value,
        start: editor.selectionStart, end: editor.selectionEnd});
    const state = {sessionId, action, sequence, composing, compositionId, events, value: editor.value, start: editor.selectionStart, end: editor.selectionEnd,
        focused: document.activeElement === editor, documentFocused: document.hasFocus(),
        window: {innerScreenX: window.mozInnerScreenX, innerScreenY: window.mozInnerScreenY},
        screen: {width: screen.width, height: screen.height, dpr: devicePixelRatio},
        rect: editor.getBoundingClientRect().toJSON()};
    document.querySelector('#status').textContent = JSON.stringify(state.events.slice(-3), null, 2);
    if (!registered) return;
    fetch('/telemetry', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(state)});
}
for (const type of ['focus','blur','keydown','keyup','beforeinput','input','compositionstart','compositionupdate','compositionend'])
    editor.addEventListener(type, report);
window.addEventListener('focus', () => report());
window.addEventListener('resize', () => report());
fetch('/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId})}).then(() => { registered = true; report(); });
</script>
